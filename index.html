<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 | 我的品牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 20px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .service-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
        .service-card h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 32px; }
        }
    </style>
</head>
<body>
    <!-- 共用導航欄會載入到這裡 -->
    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                // 標記當前頁面的導航為 active
                setTimeout(() => {
                    const links = document.querySelectorAll('#nav-placeholder nav a');
                    links.forEach(link => {
                        if (link.getAttribute('href') === 'index.html') {
                            link.style.color = '#667eea';
                            link.style.borderBottom = '2px solid #667eea';
                        }
                    });
                }, 100);
            })
            .catch(error => console.log('導航載入失敗:', error));
    </script>

    <header>
        <h1>歡迎來到我的品牌</h1>
        <p>用 AI 打造你的數位資產，完全免費上線！</p>
    </header>

    <div class="container">
        <h2 style="text-align: center;">我們的服務</h2>
        <div class="services">
            <div class="service-card">
                <h3>🚀 網站開發</h3>
                <p>快速建置專業品牌官網，響應式設計</p>
            </div>
            <div class="service-card">
                <h3>🎨 品牌設計</h3>
                <p>打造獨特的視覺識別系統</p>
            </div>
            <div class="service-card">
                <h3>🤖 AI 顧問</h3>
                <p>導入 AI 工具，提升工作效率 10 倍</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 我的品牌 | 用 GitHub Pages 免費架設</p>
    </footer>
</body>
</html>

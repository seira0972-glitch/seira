<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 | 我的品牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        header p {
            font-size: 1.2rem;
            opacity: 0.95;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
        }
        .section-title {
            text-align: center;
            font-size: 2rem;
            color: #333;
            margin-bottom: 40px;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }
        .service-card {
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(102,126,234,0.15);
        }
        .service-card h3 {
            color: #667eea;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        .service-card p {
            color: #666;
            line-height: 1.6;
        }
        footer {
            background: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            header p { font-size: 1rem; }
            .section-title { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                setTimeout(() => {
                    const links = document.querySelectorAll('#nav-placeholder nav a');
                    links.forEach(link => {
                        if (link.getAttribute('href') === 'index.html') {
                            link.style.color = '#667eea';
                            link.style.borderBottom = '2px solid #667eea';
                        }
                    });
                }, 100);
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>

    <header>
        <h1>歡迎來到我的品牌</h1>
        <p>用 AI 打造你的數位資產，完全免費上線！</p>
    </header>

    <div class="container">
        <h2 class="section-title">我們的服務</h2>
        <div class="services">
            <div class="service-card">
                <h3>🚀 網站開發</h3>
                <p>快速建置專業品牌官網，響應式設計，手機電腦完美顯示。</p>
            </div>
            <div class="service-card">
                <h3>🎨 品牌設計</h3>
                <p>打造獨特的視覺識別系統，讓你的品牌與眾不同。</p>
            </div>
            <div class="service-card">
                <h3>🤖 AI 顧問</h3>
                <p>導入 AI 工具，提升工作效率 10 倍，降低營運成本。</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 我的品牌 | 用 GitHub Pages 免費架設</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈感閣｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        /* 全域視覺優化 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
            line-height: 1.8;
            color: #3a3a3a; /* 炭灰色，比純黑溫潤 */
            background: #fdfcfb; /* 帶有紙張感的暖白 */
            letter-spacing: 0.05em;
            overflow-x: hidden;
        }

        /* 導航欄佔位 */
        #nav-placeholder {
            min-height: 80px;
        }

        /* Header 視覺焦點區 */
        header {
            padding: 160px 20px 100px;
            text-align: center;
        }

        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.8rem; /* 縮小字級以減少繁體字的沉重感 */
            font-weight: 500;
            letter-spacing: 0.45em; /* 增加呼吸感 */
            text-indent: 0.45em;    /* 重要：補償字距造成的視覺偏心 */
            color: rgba(26, 26, 26, 0.85); 
            margin-bottom: 18px;
        }

        .subtitle {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.65em; /* 強化精品雜誌的排版感 */
            text-indent: 0.65em;    /* 補償偏移 */
            color: #a68b5b;         /* 古銅金，平衡視覺重心 */
            text-transform: uppercase;
            margin-bottom: 50px;
            font-weight: 300;
        }

        header p {
            font-size: 0.85rem;
            color: #999;
            max-width: 450px;
            margin: 0 auto;
            font-weight: 300;
            letter-spacing: 0.15em;
        }

        /* 內容容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .section-title {
            text-align: left;
            font-family: 'Bodoni Moda', 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: #1a1a1a;
            margin-bottom: 60px;
            letter-spacing: 0.3em;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: rgba(0,0,0,0.04);
            margin-left: 30px;
        }

        /* 作品展示區 */
        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 80px 40px;
            margin-bottom: 120px;
        }

        .portfolio-card {
            background: transparent;
        }

        .card-visual {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #f5f3f0;
            margin-bottom: 28px;
            border: 1px solid rgba(0,0,0,0.01);
            transition: opacity 0.4s ease;
        }

        .portfolio-card:hover .card-visual {
            opacity: 0.7;
        }

        .portfolio-card h3 {
            font-family: 'Noto Serif TC', serif;
            color: #1a1a1a;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 12px;
            letter-spacing: 0.1em;
        }

        .portfolio-card p {
            color: #888;
            font-size: 0.85rem;
            font-weight: 300;
        }

        .portfolio-card a {
            display: inline-block;
            margin-top: 20px;
            color: #a68b5b;
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            border-bottom: 1px solid rgba(166, 139, 91, 0.2);
            padding-bottom: 4px;
            transition: 0.3s;
        }

        .portfolio-card a:hover {
            border-bottom-color: #a68b5b;
        }

        /* 頁腳 */
        footer {
            padding: 120px 20px 60px;
            text-align: center;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.65rem;
            letter-spacing: 0.5em;
            color: #ccc;
            text-transform: uppercase;
        }

        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #fdfcfb; }
        ::-webkit-scrollbar-thumb { background: #eee; }

        @media (max-width: 768px) {
            header h1 { font-size: 2.2rem; letter-spacing: 0.3em; text-indent: 0.3em; }
            .container { padding: 40px 24px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <header>
        <h1>靈感閣</h1>
        <div class="subtitle">WUNDERKAMMER</div>
        <p>收藏日常中的奇思，存放數位荒原裡的自留地。</p>
    </header>

    <div class="container">
        <h2 class="section-title">WORKS</h2>
        <div class="portfolio">
            <div class="portfolio-card">
                <div class="card-visual"></div>
                <h3>用 AI 做網站</h3>
                <p>Gemini + GitHub Pages 完整教學筆記，探索 AI 協作的無限可能。</p>
                <a href="note_1.html">DETAILS →</a>
            </div>
            <div class="portfolio-card">
                <div class="card-visual"></div>
                <h3>視覺識別設計</h3>
                <p>簡約而深刻的視覺語彙，為品牌注入獨一無二的靈魂。</p>
                <a href="#">DETAILS →</a>
            </div>
        </div>
    </div>

    <footer>
        WUNDERKAMMER · COLLECTED IN 2026
    </footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
            })
            .catch(err => console.error('Nav load error:', err));
    </script>
</body>
</html>

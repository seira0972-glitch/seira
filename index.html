<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈感閣｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            line-height: 1.8;
            color: #333;
            background: #fdfcfb;
            letter-spacing: 0.05em;
        }
        #nav-placeholder { min-height: 80px; }

        header { padding: 180px 20px 100px; text-align: center; }
        header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.7rem;
            font-weight: 400;
            letter-spacing: 0.45em;
            text-indent: 0.45em; /* 修正視覺偏心 */
            color: rgba(40, 40, 40, 0.9);
            margin-bottom: 20px;
        }
        .subtitle {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.65em;
            text-indent: 0.65em;
            color: #a68b5b;
            text-transform: uppercase;
            margin-bottom: 50px;
            font-weight: 300;
        }
        header p { font-size: 0.85rem; color: #999; max-width: 450px; margin: 0 auto; font-weight: 300; letter-spacing: 0.15em; }

        .container { max-width: 1000px; margin: 0 auto; padding: 80px 24px; }
        .section-title {
            text-align: left;
            font-family: 'Bodoni Moda', 'Noto Serif TC', serif;
            font-size: 1.1rem;
            margin-bottom: 60px;
            letter-spacing: 0.3em;
            display: flex;
            align-items: center;
        }
        .section-title::after { content: ''; flex-grow: 1; height: 1px; background: rgba(0,0,0,0.05); margin-left: 30px; }

        .portfolio { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 80px 40px; }
        .portfolio-card { background: transparent; }
        .card-visual { width: 100%; aspect-ratio: 16 / 10; background: #f5f3f0; margin-bottom: 28px; border: 1px solid rgba(0,0,0,0.01); }
        .portfolio-card h3 { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 500; margin-bottom: 12px; }
        .portfolio-card p { color: #888; font-size: 0.85rem; font-weight: 300; }
        .portfolio-card a {
            display: inline-block; margin-top: 20px; color: #a68b5b; text-decoration: none;
            font-size: 0.7rem; letter-spacing: 0.2em; border-bottom: 1px solid rgba(166, 139, 91, 0.2);
            padding-bottom: 4px; transition: 0.3s;
        }
        .portfolio-card a:hover { border-bottom-color: #a68b5b; }

        footer { padding: 120px 20px 60px; text-align: center; font-family: 'Bodoni Moda', serif; font-size: 0.65rem; letter-spacing: 0.5em; color: #ccc; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <header>
        <h1>靈感閣</h1>
        <div class="subtitle">WUNDERKAMMER</div>
        <p>於數位荒原中，開墾一片存放奇思的自留地。</p>
    </header>

    <div class="container">
        <h2 class="section-title">WORKS</h2>
        <div class="portfolio">
            <div class="portfolio-card">
                <div class="card-visual"></div>
                <h3>用 AI 做網站</h3>
                <p>Gemini + GitHub Pages 完整教學筆記，探索 AI 協作的無限可能。</p>
                <a href="note_1.html">DETAILS →</a>
            </div>
            <div class="portfolio-card">
                <div class="card-visual"></div>
                <h3>視覺識別設計</h3>
                <p>簡約而深刻的視覺語彙，為品牌注入獨一無二的靈魂。</p>
                <a href="#">DETAILS →</a>
            </div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                
                // 💡 一勞永逸的自動高亮腳本
                const currentPage = window.location.pathname.split("/").pop() || "index.html";
                const navLinks = document.querySelectorAll('.nav-links a');
                navLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPage) {
                        link.style.color = "#a68b5b"; // 點亮目前的頁面
                        link.style.fontWeight = "500";
                    }
                });
            })
            .catch(err => console.error('Nav load error:', err));
    </script>
</body>
</html>

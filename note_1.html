<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靈感閣 | AI 網站實踐筆記</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Noto Serif TC', serif; margin: 0; color: #333; line-height: 1.6; background-color: #fff; }
        section { max-width: 700px; margin: 0 auto; padding: 60px 20px; }
        .btn { display: inline-block; padding: 15px 40px; background: #2c2c2c; color: #fff; text-decoration: none; letter-spacing: 0.2em; font-size: 0.9rem; transition: 0.3s; cursor: pointer; border: none; }
        .btn:hover { background: #555; }
        input[type="password"] { width: 250px; padding: 12px; border: 1px solid #eee; text-align: center; font-family: 'Inter'; outline: none; margin-bottom: 20px; }
        .stat-box { border-top: 1px solid #f2f2f2; background: #fafafa; text-align: center; }
        #secret-content { display: none; background: #fff; border: 1px solid #e8e2d9; padding: 40px; margin-top: 40px; animation: fadeIn 0.8s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <section style="text-align: center;">
        <h1 style="font-weight: 500; letter-spacing: 0.1em;">《用 AI 做網站》實踐筆記</h1>
        <p style="color: #888; margin-bottom: 40px;">從靈感到上線的完整路徑錄</p>
        
        <div style="margin-bottom: 50px;">
            <p style="font-size: 1.2rem;">NT$ 3,000</p>
            <p style="font-size: 0.85rem; color: #999;">(內含 $1,000 公益捐贈，由靈感閣統一撥付)</p>
            <a href="你的綠界收款連結" target="_blank" class="btn">立即獲取解鎖密碼</a>
        </div>
    </section>

    <section id="unlock-area" style="text-align: center; border-top: 1px solid #f9f9f9;">
        <h3 style="color: #a68b5b; font-weight: 400; margin-bottom: 25px;">解鎖內容 / Unlock</h3>
        <input type="password" id="passInput" placeholder="輸入解鎖密碼">
        <br>
        <button onclick="unlockContent()" class="btn" style="padding: 10px 30px; font-size: 0.8rem;">ENTER</button>
        <p id="error-msg" style="color: #d9534f; font-size: 0.8rem; margin-top: 15px; display: none;">密碼不正確</p>

        <div id="secret-content">
            <h2 style="color: #b59d6e; border-bottom: 1px solid #eee; padding-bottom: 15px;">實踐筆記正文</h2>
            <div style="text-align: left; color: #444;">
                <p>恭喜解鎖！這裡是你價值 3,000 元的實踐精華...</p>
                <blockquote>
                    "數據不會騙人，但邏輯會讓你看到數據背後的真相。"
                </blockquote>
            </div>
        </div>
    </section>

    <section class="stat-box">
        <div style="font-size: 0.7rem; letter-spacing: 0.3em; color: #b59d6e; margin-bottom: 30px;">IMPACT</div>
        
        <div style="margin-bottom: 30px;">
            <p style="font-size: 0.9rem; color: #888;">115.4月 當前累積人數</p>
            <span style="font-size: 2.2rem; font-weight: 300;">12</span> <span style="font-size: 0.9rem;">位</span>
        </div>

        <div style="font-size: 0.8rem; color: #bbb; line-height: 2;">
            115.3月 已累計：20 人 (已於 4/10 撥付)<br>
            115.2月 已累計：15 人 (已於 3/10 撥付)
        </div>

        <div style="margin-top: 40px;">
            <a href="https://drive.google.com/drive/folders/1IywwNOo8CV4HV-E1prEeGGqDd8_9nqTc" target="_blank" 
               style="color: #a68b5b; font-size: 0.75rem; text-decoration: underline;">查看雲端公益收據紀錄</a>
        </div>
    </section>

    <footer style="text-align: center; padding: 40px; color: #ccc; font-size: 0.7rem; letter-spacing: 0.1em;">
        © 2026 INSPIRATION PAVILION
    </footer>

    <script>
        function unlockContent() {
            const input = document.getElementById('passInput').value;
            const content = document.getElementById('secret-content');
            const error = document.getElementById('error-msg');

            // 預設密碼：Idea2026 (Base64: SWRlYTIwMjY=)
            if (btoa(input) === "SWRlYTIwMjY=") {
                content.style.display = "block";
                error.style.display = "none";
                document.getElementById('passInput').style.display = "none";
                document.querySelector('#unlock-area button').style.display = "none";
                window.scrollTo({ top: content.offsetTop - 50, behavior: 'smooth' });
            } else {
                error.style.display = "block";
                document.getElementById('passInput').value = "";
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>課程收集器｜靈感閣</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            line-height: 1.7;
        }
        #nav-placeholder {
            min-height: 85px;
            width: 100%;
        }
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 60px 40px 100px;
        }
        .page-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #2c2c2c;
            margin-bottom: 12px;
            text-align: center;
        }
        .page-sub {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 0.1em;
            border-top: 1px solid #ece5e0;
            display: inline-block;
            padding-top: 10px;
            text-align: center;
            width: 100%;
            margin-bottom: 48px;
        }
        .card-block {
            border-bottom: 1px solid #ece5e0;
            padding-bottom: 28px;
            margin-bottom: 48px;
            transition: border-color 0.25s ease;
        }
        .card-block:hover {
            border-bottom-color: #b59d6e;
        }
        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: #b59d6e;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            text-align: center;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 32px;
            justify-content: center;
        }
        select {
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            border: 1px solid #e2d9d2;
            background: #fff;
            transition: 0.2s;
            min-width: 200px;
        }
        select:focus {
            outline: none;
            border-color: #b59d6e;
        }
        .course-item {
            border-bottom: 1px solid #f0ede8;
            padding: 20px 0;
            transition: 0.2s;
        }
        .course-item:hover {
            border-bottom-color: #b59d6e;
        }
        .course-name {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: #b59d6e;
            margin-bottom: 8px;
        }
        .course-meta {
            font-size: 0.85rem;
            color: #666;
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .course-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .empty-message {
            text-align: center;
            color: #bcb2a4;
            padding: 48px 20px;
            font-size: 0.9rem;
        }
        footer {
            text-align: center;
            padding: 48px 40px 32px;
            border-top: 1px solid #f0ede8;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.45em;
            color: #bcb2a4;
            text-transform: uppercase;
            margin-top: 40px;
            background: #fefcf9;
        }
        @media (max-width: 768px) {
            .container { padding: 40px 24px 80px; }
            .page-title { font-size: 1.4rem; }
            .course-meta { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-title">📚 全台課程一覽</div>
        <div class="page-sub">選擇城市・瀏覽課程</div>

        <div class="card-block">
            <div class="card-title">📍 選擇縣市</div>
            <div class="filter-bar">
                <select id="regionSelect">
                    <option value="">-- 請選擇城市 --</option>
                    <option value="台北">台北市</option>
                    <option value="新北">新北市</option>
                    <option value="基隆">基隆市</option>
                    <option value="桃園">桃園市</option>
                    <option value="新竹">新竹縣市</option>
                    <option value="苗栗">苗栗縣</option>
                    <option value="台中">台中市</option>
                    <option value="彰化">彰化縣</option>
                    <option value="南投">南投縣</option>
                    <option value="雲林">雲林縣</option>
                    <option value="嘉義">嘉義縣市</option>
                    <option value="台南">台南市</option>
                    <option value="高雄">高雄市</option>
                    <option value="屏東">屏東縣</option>
                    <option value="宜蘭">宜蘭縣</option>
                    <option value="花蓮">花蓮縣</option>
                    <option value="台東">台東縣</option>
                    <option value="線上">🌐 線上課程</option>
                </select>
            </div>
            <div id="courseList">
                <div class="empty-message">👈 請從左側選擇一個城市</div>
            </div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        // 導航列載入
        fetch('nav.html')
            .then(res => {
                if (!res.ok) throw new Error('nav not found');
                return res.text();
            })
            .then(data => {
                const navContainer = document.getElementById('nav-placeholder');
                if (navContainer) {
                    navContainer.innerHTML = data;
                    const scripts = navContainer.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            })
            .catch(err => {
                console.log('導航組件載入略過:', err);
                const navDiv = document.getElementById('nav-placeholder');
                if (navDiv && !navDiv.innerHTML.trim()) {
                    navDiv.style.minHeight = '40px';
                }
            });

        // ========= 課程資料庫（你可以自由編輯這裡） =========
        const coursesDB = {
            "台北": [
                { name: "AI 實戰工作坊", date: "2025/7/15-7/16", provider: "資策會", location: "台北市大安區", type: "工作坊" },
                { name: "UX 設計入門", date: "2025/8/5-8/26 (每週二)", provider: "設計研究所", location: "台北市中山區", type: "實體講座" },
                { name: "Python 資料分析", date: "2025/9/1 開課", provider: "Coding Taipei", location: "線上+實體", type: "線上課程" }
            ],
            "台中": [
                { name: "咖啡拉花基礎班", date: "2025/7/20", provider: "中區職訓", location: "台中市西區", type: "實體講座" },
                { name: "數位行銷策略", date: "2025/8/10-8/31", provider: "台中商會", location: "台中市北屯區", type: "工作坊" }
            ],
            "高雄": [
                { name: "駁二藝術講堂", date: "2025/7/25-7/27", provider: "高雄文化局", location: "高雄市鹽埕區", type: "講座" },
                { name: "前端開發密集班", date: "2025/8/12-9/30", provider: "高雄前端社群", location: "高雄市前鎮區", type: "線上課程" }
            ],
            "台南": [
                { name: "老屋創業分享", date: "2025/8/3", provider: "台南青創", location: "台南市中西區", type: "講座" }
            ],
            "線上": [
                { name: "SEO 從零到一", date: "隨時可開始", provider: "線上學院", location: "全球", type: "線上課程" },
                { name: "UI 設計系統", date: "2025/7/30 上線", provider: "設計慕課", location: "線上", type: "線上課程" }
            ]
        };

        function renderCourses(region) {
            const container = document.getElementById("courseList");
            const courses = coursesDB[region];
            if (!courses || courses.length === 0) {
                container.innerHTML = `<div class="empty-message">📭 目前「${region}」尚無公開課程，歡迎提供資訊～</div>`;
                return;
            }
            let html = "";
            courses.forEach(course => {
                html += `
                    <div class="course-item">
                        <div class="course-name">${escapeHtml(course.name)}</div>
                        <div class="course-meta">
                            <span>📅 ${escapeHtml(course.date)}</span>
                            <span>🏢 ${escapeHtml(course.provider)}</span>
                            <span>📍 ${escapeHtml(course.location)}</span>
                            <span>🏷️ ${escapeHtml(course.type)}</span>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }

        document.getElementById("regionSelect").addEventListener("change", (e) => {
            const region = e.target.value;
            if (region) {
                renderCourses(region);
            } else {
                document.getElementById("courseList").innerHTML = `<div class="empty-message">👈 請從左側選擇一個城市</div>`;
            }
        });
    </script>
</body>
</html>

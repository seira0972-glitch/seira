<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>課程解析器｜靈感閣</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            line-height: 1.7;
        }
        #nav-placeholder { min-height: 85px; width: 100%; }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 60px 40px 100px;
        }
        .page-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #2c2c2c;
            margin-bottom: 12px;
            text-align: center;
        }
        .page-sub {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 0.1em;
            border-top: 1px solid #ece5e0;
            display: inline-block;
            padding-top: 10px;
            text-align: center;
            width: 100%;
            margin-bottom: 48px;
        }
        .card-block {
            border-bottom: 1px solid #ece5e0;
            padding-bottom: 28px;
            margin-bottom: 48px;
            transition: border-color 0.25s ease;
        }
        .card-block:hover { border-bottom-color: #b59d6e; }
        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: #b59d6e;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            text-align: center;
        }
        textarea {
            width: 100%;
            padding: 16px;
            font-family: 'Inter', monospace;
            font-size: 0.9rem;
            border: 1px solid #e2d9d2;
            background: #fefcf9;
            transition: 0.2s;
            margin-bottom: 20px;
            border-radius: 0;
        }
        textarea:focus {
            outline: none;
            border-color: #b59d6e;
        }
        button {
            background: transparent;
            border: 1px solid #b59d6e;
            padding: 8px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: #b59d6e;
            cursor: pointer;
            transition: all 0.25s;
            margin-right: 12px;
            margin-bottom: 12px;
        }
        button:hover {
            background: #b59d6e;
            color: white;
            border-color: #b59d6e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #ece5e0;
            vertical-align: top;
        }
        th {
            font-family: 'Noto Serif TC', serif;
            font-weight: 500;
            color: #b59d6e;
            cursor: pointer;
            user-select: none;
        }
        th:hover {
            background: #fefaf5;
        }
        .sort-icon {
            font-size: 0.7rem;
            margin-left: 6px;
            opacity: 0.6;
        }
        .empty-message {
            text-align: center;
            color: #bcb2a4;
            padding: 48px 20px;
        }
        .note {
            font-size: 0.75rem;
            background: #fefaf5;
            padding: 12px 16px;
            border-left: 2px solid #b59d6e;
            margin-bottom: 32px;
            color: #6e5e4a;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        footer {
            text-align: center;
            padding: 48px 40px 32px;
            border-top: 1px solid #f0ede8;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.45em;
            color: #bcb2a4;
            text-transform: uppercase;
            background: #fefcf9;
        }
        @media (max-width: 768px) {
            .container { padding: 40px 24px 80px; }
            .page-title { font-size: 1.4rem; }
            th, td { padding: 8px 4px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-title">📚 課程智慧解析器</div>
        <div class="page-sub">貼上課程文字・AI 自動整理成表格</div>

        <div class="note">
            ⚠️ 使用前請先到 <a href="https://aistudio.google.com/" target="_blank" style="color:#b59d6e;">Google AI Studio</a> 取得 Gemini API 金鑰，<br>
            並修改本頁面程式碼中的 <strong>「你的Gemini_API金鑰」</strong>（位於底部 script 區）。
        </div>

        <div class="card-block">
            <div class="card-title">✍️ 貼上課程文字</div>
            <textarea id="rawText" rows="6" placeholder="請貼上從網站複製的課程資訊，例如：&#10;2025/8/5  AI實戰工作坊 台北市大安區 資策會&#10;每週三19:00-21:00  日語初級班  台北中心  救國團&#10;9/1-9/30  Python資料分析  線上課程  Coding Taipei"></textarea>
            <div>
                <button id="parseBtn">✨ AI 解析並顯示課程</button>
                <button id="clearBtn">清空文字</button>
                <button id="exportCsvBtn" style="display:none;">📎 匯出 CSV</button>
            </div>
        </div>

        <div class="card-block" id="resultBlock" style="display:none;">
            <div class="toolbar">
                <div class="card-title" style="margin-bottom:0;">📖 課程清單</div>
                <div>
                    <button id="copyTableBtn">複製表格</button>
                </div>
            </div>
            <div id="tableContainer"></div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        // 導航列載入
        fetch('nav.html')
            .then(res => {
                if (!res.ok) throw new Error('nav not found');
                return res.text();
            })
            .then(data => {
                const navContainer = document.getElementById('nav-placeholder');
                if (navContainer) {
                    navContainer.innerHTML = data;
                    const scripts = navContainer.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            })
            .catch(err => console.log('導航載入略過:', err));

        // ========= 請填寫你的 Gemini API 金鑰 =========
        const API_KEY = "AIzaSyDoDmsULVJSI-WHz5kBeTLvhJE8u_0UHGc";
        const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        const PROMPT = `你是一個課程資訊解析助手。從下面這段文字中，提取出所有課程，每筆課程包含「日期」(date)、「課程名稱」(course)、「地點」(location)、「開課單位」(organizer)。如果某個欄位沒有明確寫出，就填「不详」。輸出格式必須是純 JSON 陣列，不要有任何其他文字或說明。範例：[{"date":"2025/8/5","course":"AI實戰工作坊","location":"台北市大安區","organizer":"資策會"}]`;

        let currentCourses = [];
        let currentSort = { column: 'date', order: 'asc' };

        function renderTable(courses, sortColumn, sortOrder) {
            if (!courses || courses.length === 0) {
                document.getElementById("tableContainer").innerHTML = '<div class="empty-message">📭 無課程資料</div>';
                document.getElementById("exportCsvBtn").style.display = "none";
                return;
            }

            const sorted = [...courses].sort((a, b) => {
                let valA = a[sortColumn] || "";
                let valB = b[sortColumn] || "";
                if (sortColumn === 'date') {
                    const dateA = new Date(valA);
                    const dateB = new Date(valB);
                    if (!isNaN(dateA) && !isNaN(dateB)) {
                        return sortOrder === 'asc' ? dateA - dateB : dateB - dateA;
                    }
                }
                return sortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
            });

            let html = `<div style="overflow-x: auto;"><table>
                <thead>
                    <tr>
                        <th data-column="date">日期 <span class="sort-icon">${sortColumn === 'date' ? (sortOrder === 'asc' ? '▲' : '▼') : '⋮'}</span></th>
                        <th data-column="course">課程名稱 <span class="sort-icon">${sortColumn === 'course' ? (sortOrder === 'asc' ? '▲' : '▼') : '⋮'}</span></th>
                        <th data-column="location">地點 <span class="sort-icon">${sortColumn === 'location' ? (sortOrder === 'asc' ? '▲' : '▼') : '⋮'}</span></th>
                        <th data-column="organizer">開課單位 <span class="sort-icon">${sortColumn === 'organizer' ? (sortOrder === 'asc' ? '▲' : '▼') : '⋮'}</span></th>
                    </tr>
                </thead>
                <tbody>`;
            sorted.forEach(c => {
                html += `<tr>
                    <td>${escapeHtml(c.date)}</td>
                    <td>${escapeHtml(c.course)}</td>
                    <td>${escapeHtml(c.location)}</td>
                    <td>${escapeHtml(c.organizer)}</td>
                </tr>`;
            });
            html += `</tbody>
            </table></div>`;
            document.getElementById("tableContainer").innerHTML = html;
            document.getElementById("exportCsvBtn").style.display = "inline-block";

            document.querySelectorAll("th[data-column]").forEach(th => {
                th.addEventListener("click", () => {
                    const column = th.dataset.column;
                    if (currentSort.column === column) {
                        currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
                    } else {
                        currentSort.column = column;
                        currentSort.order = 'asc';
                    }
                    renderTable(currentCourses, currentSort.column, currentSort.order);
                });
            });
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }

        async function parseCoursesWithAI(text) {
            const body = { contents: [{ parts: [{ text: PROMPT + "\n\n文字：" + text }] }] };
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error(`API 請求失敗: ${res.status}`);
            const data = await res.json();
            const raw = data.candidates[0].content.parts[0].text;
            const jsonMatch = raw.match(/\[\s*\{[\s\S]*\}\s*\]/);
            if (!jsonMatch) throw new Error("AI 回傳格式錯誤，找不到 JSON 陣列");
            return JSON.parse(jsonMatch[0]);
        }

        document.getElementById("parseBtn").onclick = async () => {
            const raw = document.getElementById("rawText").value.trim();
            if (!raw) { alert("請貼上課程文字"); return; }
            const parseBtn = document.getElementById("parseBtn");
            parseBtn.disabled = true;
            parseBtn.textContent = "🤖 AI 解析中...";
            try {
                const courses = await parseCoursesWithAI(raw);
                if (!courses || courses.length === 0) throw new Error("無課程資料");
                currentCourses = courses;
                currentSort = { column: 'date', order: 'asc' };
                renderTable(currentCourses, currentSort.column, currentSort.order);
                document.getElementById("resultBlock").style.display = "block";
            } catch (e) {
                alert("解析失敗：" + e.message);
                console.error(e);
            } finally {
                parseBtn.disabled = false;
                parseBtn.textContent = "✨ AI 解析並顯示課程";
            }
        };

        document.getElementById("clearBtn").onclick = () => {
            document.getElementById("rawText").value = "";
            document.getElementById("resultBlock").style.display = "none";
            currentCourses = [];
        };

        document.getElementById("exportCsvBtn").onclick = () => {
            if (!currentCourses.length) return;
            let csvRows = [["日期","課程名稱","地點","開課單位"]];
            currentCourses.forEach(c => {
                csvRows.push([c.date, c.course, c.location, c.organizer].map(v => `"${v.replace(/"/g, '""')}"`));
            });
            const csvContent = csvRows.map(row => row.join(",")).join("\n");
            const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "courses.csv";
            link.click();
        };

        document.getElementById("copyTableBtn").onclick = () => {
            if (!currentCourses.length) return;
            let text = "日期\t課程名稱\t地點\t開課單位\n";
            currentCourses.forEach(c => {
                text += `${c.date}\t${c.course}\t${c.location}\t${c.organizer}\n`;
            });
            navigator.clipboard.writeText(text).then(() => alert("表格已複製到剪貼簿 (Tab 分隔)"));
        };
    </script>
</body>
</html>

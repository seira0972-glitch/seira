<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>課程收集器｜靈感閣</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            line-height: 1.7;
        }
        #nav-placeholder {
            min-height: 85px;
            width: 100%;
        }
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 60px 40px 100px;
        }
        .page-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #2c2c2c;
            margin-bottom: 12px;
            text-align: center;
        }
        .page-sub {
            font-size: 0.8rem;
            color: #888;
            letter-spacing: 0.1em;
            border-top: 1px solid #ece5e0;
            display: inline-block;
            padding-top: 10px;
            text-align: center;
            width: 100%;
            margin-bottom: 48px;
        }
        .card-block {
            border-bottom: 1px solid #ece5e0;
            padding-bottom: 28px;
            margin-bottom: 48px;
            transition: border-color 0.25s ease;
        }
        .card-block:hover { border-bottom-color: #b59d6e; }
        .card-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 500;
            color: #b59d6e;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
            text-align: center;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            border: 1px solid #e2d9d2;
            background: #fff;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #b59d6e;
        }
        .row2 {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row2 > * { flex: 1; }
        .row3 {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .row3 > * { flex: 1; }
        button {
            background: transparent;
            border: 1px solid #b59d6e;
            padding: 8px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: #b59d6e;
            cursor: pointer;
            transition: all 0.25s;
        }
        button:hover {
            background: #b59d6e;
            color: white;
            border-color: #b59d6e;
        }
        .course-item {
            border-bottom: 1px solid #f0ede8;
            padding: 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .course-item:hover { border-bottom-color: #b59d6e; }
        .course-info strong {
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
        }
        .course-meta {
            font-size: 0.8rem;
            color: #888;
            margin-top: 6px;
        }
        .course-status {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 10px;
        }
        .status-completed { background: #e8f0e8; color: #2c6e2c; }
        .status-progress { background: #fef0e8; color: #b5753c; }
        .status-planned { background: #e8e8fd; color: #5a5ab5; }
        .region-badge {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 8px;
            background: #f0ede8;
            color: #6e5e4a;
        }
        .delete-btn, .complete-btn {
            border-color: #dcb5a0;
            color: #b87a5a;
            padding: 4px 16px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
        .complete-btn { border-color: #8fb88f; color: #4a7a4a; }
        .filter-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .filter-bar input, .filter-bar select {
            flex: 1;
            margin-bottom: 0;
        }
        .stats {
            text-align: right;
            font-size: 0.75rem;
            color: #bcb2a4;
            margin-bottom: 16px;
        }
        footer {
            text-align: center;
            padding: 48px 40px 32px;
            border-top: 1px solid #f0ede8;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.45em;
            color: #bcb2a4;
            text-transform: uppercase;
            margin-top: 40px;
            background: #fefcf9;
        }
        @media (max-width: 768px) {
            .container { padding: 40px 24px 80px; }
            .page-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-title">📚 全台課程收集器</div>
        <div class="page-sub">記錄想學的一切・全台縣市篩選</div>

        <div class="card-block">
            <div class="card-title">✏️ 新增課程</div>
            <input type="text" id="courseName" placeholder="課程名稱 (必填)">
            <div class="row3">
                <input type="text" id="courseDate" placeholder="日期 (如 2025/8/15 或 每週三)">
                <input type="text" id="courseProvider" placeholder="開課單位 / 老師">
                <select id="courseRegion">
                    <option value="">📍 選擇縣市</option>
                    <option value="台北">台北市</option><option value="新北">新北市</option>
                    <option value="基隆">基隆市</option><option value="桃園">桃園市</option>
                    <option value="新竹">新竹縣市</option><option value="苗栗">苗栗縣</option>
                    <option value="台中">台中市</option><option value="彰化">彰化縣</option>
                    <option value="南投">南投縣</option><option value="雲林">雲林縣</option>
                    <option value="嘉義">嘉義縣市</option><option value="台南">台南市</option>
                    <option value="高雄">高雄市</option><option value="屏東">屏東縣</option>
                    <option value="宜蘭">宜蘭縣</option><option value="花蓮">花蓮縣</option>
                    <option value="台東">台東縣</option>
                    <option value="線上">🌐 線上課程</option>
                </select>
            </div>
            <div class="row2">
                <select id="courseType">
                    <option value="線上課程">線上課程</option>
                    <option value="實體講座">實體講座</option>
                    <option value="證照考試">證照/考試</option>
                    <option value="工作坊">工作坊</option>
                    <option value="語言學習">語言學習</option>
                    <option value="其他">其他</option>
                </select>
                <select id="courseStatus">
                    <option value="planned">📅 計劃中</option>
                    <option value="progress">⚡ 進行中</option>
                    <option value="completed">✅ 已完成</option>
                </select>
            </div>
            <textarea id="courseNote" rows="2" placeholder="備註、課程連結或心得"></textarea>
            <button id="addCourseBtn">＋ 新增課程</button>
        </div>

        <div class="card-block">
            <div class="card-title">📖 我的課程清單</div>
            <div class="filter-bar">
                <input type="text" id="searchCourse" placeholder="搜尋課程名稱或單位">
                <select id="filterRegion">
                    <option value="">📍 全部縣市</option>
                    <option value="台北">台北市</option><option value="新北">新北市</option>
                    <option value="基隆">基隆市</option><option value="桃園">桃園市</option>
                    <option value="新竹">新竹縣市</option><option value="苗栗">苗栗縣</option>
                    <option value="台中">台中市</option><option value="彰化">彰化縣</option>
                    <option value="南投">南投縣</option><option value="雲林">雲林縣</option>
                    <option value="嘉義">嘉義縣市</option><option value="台南">台南市</option>
                    <option value="高雄">高雄市</option><option value="屏東">屏東縣</option>
                    <option value="宜蘭">宜蘭縣</option><option value="花蓮">花蓮縣</option>
                    <option value="台東">台東縣</option>
                    <option value="線上">🌐 線上課程</option>
                </select>
                <select id="filterType">
                    <option value="">📂 全部類型</option>
                    <option value="線上課程">線上課程</option>
                    <option value="實體講座">實體講座</option>
                    <option value="證照考試">證照/考試</option>
                    <option value="工作坊">工作坊</option>
                    <option value="語言學習">語言學習</option>
                    <option value="其他">其他</option>
                </select>
                <select id="filterStatus">
                    <option value="">📌 全部狀態</option>
                    <option value="planned">📅 計劃中</option>
                    <option value="progress">⚡ 進行中</option>
                    <option value="completed">✅ 已完成</option>
                </select>
            </div>
            <div class="stats" id="courseStats"></div>
            <div id="courseList">載入中...</div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => {
                if (!res.ok) throw new Error('nav not found');
                return res.text();
            })
            .then(data => {
                const navContainer = document.getElementById('nav-placeholder');
                if (navContainer) {
                    navContainer.innerHTML = data;
                    const scripts = navContainer.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        oldScript.parentNode.replaceChild(newScript, oldScript);
                    });
                }
            })
            .catch(err => {
                console.log('導航組件載入略過:', err);
                const navDiv = document.getElementById('nav-placeholder');
                if (navDiv && !navDiv.innerHTML.trim()) {
                    navDiv.style.minHeight = '40px';
                }
            });

        let courses = [];
        
        function loadCourses() {
            const stored = localStorage.getItem("courses_all");
            if (stored) courses = JSON.parse(stored);
            renderCourses();
        }
        
        function saveCourses() {
            localStorage.setItem("courses_all", JSON.stringify(courses));
            renderCourses();
        }
        
        function getStatusText(status) {
            switch(status) {
                case 'planned': return '📅 計劃中';
                case 'progress': return '⚡ 進行中';
                case 'completed': return '✅ 已完成';
                default: return '📅 計劃中';
            }
        }
        
        function getStatusClass(status) {
            switch(status) {
                case 'completed': return 'status-completed';
                case 'progress': return 'status-progress';
                default: return 'status-planned';
            }
        }
        
        function renderCourses() {
            const keyword = document.getElementById("searchCourse").value.toLowerCase();
            const regionFilter = document.getElementById("filterRegion").value;
            const typeFilter = document.getElementById("filterType").value;
            const statusFilter = document.getElementById("filterStatus").value;
            
            let filtered = courses.filter(c => {
                const matchKeyword = (c.name + (c.provider || "")).toLowerCase().includes(keyword);
                const matchRegion = regionFilter === "" || c.region === regionFilter;
                const matchType = typeFilter === "" || c.type === typeFilter;
                const matchStatus = statusFilter === "" || c.status === statusFilter;
                return matchKeyword && matchRegion && matchType && matchStatus;
            });
            
            const total = courses.length;
            const completed = courses.filter(c => c.status === 'completed').length;
            const progress = courses.filter(c => c.status === 'progress').length;
            const planned = courses.filter(c => c.status === 'planned').length;
            document.getElementById("courseStats").innerHTML = `📊 總計 ${total} 堂 | ✅ 已完成 ${completed} | ⚡ 進行中 ${progress} | 📅 計劃中 ${planned}`;
            
            const container = document.getElementById("courseList");
            if (filtered.length === 0) {
                container.innerHTML = "📭 尚無課程，新增一筆吧";
                return;
            }
            
            container.innerHTML = filtered.map((c, idx) => {
                const originalIdx = courses.findIndex(x => x === c);
                const statusText = getStatusText(c.status);
                const statusClass = getStatusClass(c.status);
                const regionDisplay = c.region === "線上" ? "🌐 線上" : (c.region ? `📍 ${c.region}` : "");
                
                return `<div class="course-item">
                    <div class="course-info">
                        <strong>${escapeHtml(c.name)}</strong>
                        <span class="course-status ${statusClass}">${statusText}</span>
                        ${regionDisplay ? `<span class="region-badge">${regionDisplay}</span>` : ""}
                        <div class="course-meta">
                            📅 ${c.date || "日期未定"} &nbsp; 🏷️ ${c.type} &nbsp; 👤 ${c.provider || "-"}
                        </div>
                        <div style="font-size:0.75rem; color:#6a

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #333; letter-spacing: 0.05em; line-height: 1.8; height: 100vh; display: flex; flex-direction: column; }
        #nav-placeholder { min-height: 80px; width: 100%; }

        /* 讓內容垂直居中，營造空間感 */
        .container { 
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
        }
        
        .content-wrapper {
            max-width: 600px;
            text-align: center; /* 居中排版更顯莊重 */
        }

        .main-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.15rem;
            color: #333;
            line-height: 2.8;
            font-weight: 300;
            letter-spacing: 0.2em;
        }

        .en-brand {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            color: #a68b5b;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
        }

        footer { 
            padding: 60px 20px; 
            text-align: center; 
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.6rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .main-text { font-size: 1rem; line-height: 2.4; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <span class="en-brand">WunderKammer</span>
            <p class="main-text">
                靈感閣 / WunderKammer<br>
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                // 強制執行導航欄腳本，確保 About 高亮
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.error('Error:', err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #333; letter-spacing: 0.05em; line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        /* 💡 容器：確保文字從左側優雅開啟 */
        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 200px 80px 100px; /* 增加左側內距，讓文字不要貼邊 */
        }
        
        .content-wrapper {
            max-width: 600px;
            border-left: 2px solid #a68b5b; /* 💡 左側加入一條垂直金褐色細線，象徵座標點 */
            padding-left: 40px; /* 文字與線的距離 */
        }

        .main-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            color: #333;
            line-height: 2.8; /* 寬廣的行距 */
            font-weight: 300;
            letter-spacing: 0.25em;
            text-align: left; /* 💡 絕對左對齊 */
        }

        footer { 
            margin-top: 150px;
            padding: 60px 80px; 
            text-align: left; /* 💡 Footer 也改為左對齊，維持視覺一致性 */
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.6rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 150px 30px 60px; }
            .content-wrapper { padding-left: 20px; }
            .main-text { font-size: 1rem; line-height: 2.4; }
            footer { padding: 60px 30px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <p class="main-text">
                靈感閣 / WunderKammer<br>
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

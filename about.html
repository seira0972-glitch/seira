<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #2a2a2a;
            line-height: 1.7;
        }

        #nav-placeholder {
            min-height: 72px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 32px 100px;
        }

        /* 主標題 */
        .page-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 500;
            color: #1e1e1e;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
        }

        /* 副標題 / 金色分隔線 */
        .subhead {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            font-weight: 400;
            color: #b59d6e;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 48px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ece5e0;
        }

        /* 文章段落 */
        .article-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            line-height: 1.9;
            color: #4a4a4a;
            margin-bottom: 32px;
        }

        .article-text:last-of-type {
            margin-bottom: 0;
        }

        /* 引言區塊（可選） */
        .quote-block {
            margin: 48px 0;
            padding-left: 24px;
            border-left: 2px solid #b59d6e;
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            font-weight: 400;
            color: #5e5e5e;
            font-style: normal;
        }

        /* 頁尾 */
        footer {
            margin-top: 80px;
            padding: 32px 32px;
            text-align: center;
            border-top: 1px solid #ece5e0;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            color: #b59d6e;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .container {
                padding: 60px 24px 80px;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .article-text {
                font-size: 0.95rem;
                line-height: 1.8;
            }
            .quote-block {
                font-size: 0.95rem;
                margin: 32px 0;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <h1 class="page-title">關於這裡</h1>
        <div class="subhead">WunderKammer · 靈感閣</div>

        <p class="article-text">
            靈感閣不是一個喧囂的地方。它更像一座小小的奇珍櫃（WunderKammer），收藏著那些在日常中閃現的靈光、反覆推敲的草稿、與逐漸成形的想法。
        </p>

        <p class="article-text">
            在這裡，你會找到關於網站架設的完整教學、設計練習的筆記、以及一些數位工具的探索。沒有演算法打擾，沒有多餘的資訊轟炸——只有安靜整理的內容，與願意停留閱讀的你。
        </p>

        <div class="quote-block">
            「收藏奇思，存放日常」<br>
            是我為這個空間留下的唯一註解。
        </div>

        <p class="article-text">
            如果你也喜歡這樣的角落，歡迎隨意翻閱。若有任何想法或疑問，可以透過「聯繫」頁面找到我。希望這裡的內容，能成為你創作路上的一點陪伴。
        </p>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Noto+Serif+TC:wght@200;300;400&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        
        body { 
            font-family: 'Inter', 'Noto Serif TC', serif; 
            background: #fdfcfb; 
            color: #222; 
            letter-spacing: 0.05em; 
            /* 💡 增加一點顆粒感，讓白色不那麼刺眼 */
            background-image: radial-gradient(#e5e5e5 0.5px, transparent 0.5px);
            background-size: 30px 30px;
            background-attachment: fixed;
        }

        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 220px 80px 100px;
        }
        
        .content-wrapper {
            max-width: 700px;
            border-left: 1px solid rgba(166, 139, 91, 0.5); /* 💡 降低線條濃度，讓它更像光影 */
            padding-left: 60px;
            position: relative;
        }

        /* 💡 標題：消除「詭異感」的排版 */
        .brand-header {
            margin-bottom: 80px;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        /* 💡 中文：放大、變細、變淡 */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.8rem; /* 再放大，用尺寸壓住詭異感 */
            font-weight: 200; /* 鎖定最細 */
            color: rgba(26, 26, 26, 0.85); /* 💡 稍微透明，減少死黑感 */
            letter-spacing: 0.5em; /* 拉開字距，讓每個字都像獨立標本 */
            display: block;
            margin-bottom: 12px; 
            line-height: 1.1;
        }
        
        /* 💡 英文：金色底座，強化粗細對比 */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.55rem; 
            color: #a68b5b;
            letter-spacing: 1.2em; /* 極寬字距 */
            text-transform: uppercase;
            display: block;
            font-weight: 600; /* 💡 再加粗一點，形成穩定的「地基」 */
            text-indent: 1.2em; 
            opacity: 0.9;
        }

        /* 💡 內文：優雅流動 */
        .description-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            color: #555;
            line-height: 3.2; /* 💡 再拉大行高，讓閱讀變慢 */
            font-weight: 300;
            letter-spacing: 0.25em;
            text-align: left;
        }

        footer { 
            margin-top: 180px;
            padding: 60px 80px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.6rem; 
            letter-spacing: 0.6em; 
            color: #bbb; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 160px 35px 80px; }
            .content-wrapper { padding-left: 25px; }
            .brand-zh { font-size: 1.9rem; letter-spacing: 0.35em; }
            .description-text { font-size: 0.95rem; line-height: 2.6; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <header class="brand-header">
                <span class="brand-zh">靈感閣</span>
                <span class="brand-en">WunderKammer</span>
            </header>
            
            <p class="description-text">
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

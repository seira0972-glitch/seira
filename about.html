<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Noto+Serif+TC:wght@300;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #a68b5b; 
            --bg-color: #f4f4f2;    
            --text-main: #2c2c2c;
            --text-sub: #666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.8;
        }

        #nav-placeholder { min-height: 80px; }

        .main-content { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 160px 100px 120px; 
            display: flex;
            flex-direction: column;
            gap: 70px;
        }

        /* 💡 疊加式標題：化解中文單獨存在的生硬感 */
        .hero-title {
            position: relative;
            display: inline-block;
            margin-bottom: 20px;
        }

        .hero-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 5.5rem;
            font-style: italic;
            color: rgba(166, 139, 91, 0.12); 
            letter-spacing: 0.05em;
            line-height: 0.8;
            user-select: none;
        }

        .hero-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.6rem;
            font-weight: 500;
            color: var(--text-main);
            position: absolute;
            left: 0.1em;
            bottom: -0.1em;
            letter-spacing: 0.45em;
        }

        /* 💡 核心宣言 */
        .manifesto {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.15rem;
            letter-spacing: 0.25em;
            color: var(--text-main);
            border-left: 2px solid var(--accent-color);
            padding-left: 35px;
            line-height: 2.8;
        }

        /* 💡 截圖文字區塊 */
        .detail-section {
            max-width: 680px;
            margin-left: 40px; 
        }

        .article-text {
            font-size: 0.95rem;
            color: var(--text-sub);
            letter-spacing: 0.12em;
            line-height: 2.6;
            margin-bottom: 2.5rem;
            text-align: justify;
        }

        /* 💡 引用卡片：收藏奇思 */
        .quote-card {
            background: rgba(255, 255, 255, 0.6);
            padding: 45px;
            border-left: 1px solid var(--accent-color);
            margin: 60px 0;
            position: relative;
        }

        .quote-content {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.15rem;
            color: var(--accent-color);
            letter-spacing: 0.4em;
            display: block;
            margin-bottom: 12px;
        }

        .quote-sub {
            font-size: 0.85rem;
            color: #999;
            letter-spacing: 0.1em;
        }

        footer { 
            padding: 80px 100px;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.65rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .main-content { padding: 120px 30px 60px; }
            .hero-en { font-size: 3.8rem; }
            .hero-zh { font-size: 1.8rem; }
            .detail-section { margin-left: 0; }
            .manifesto { font-size: 1rem; padding-left: 20px; }
            footer { padding: 60px 30px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="main-content">
        <div class="hero-title">
            <span class="hero-en">WunderKammer</span>
            <h1 class="hero-zh">靈感閣</h1>
        </div>

        <div class="manifesto">
            這裡是一個無聲的數位座標<br>
            於廣袤的荒原中，存放閃爍的奇思異想
        </div>

        <div class="detail-section">
            <p class="article-text">
                靈感閣收藏著那些在日常中閃現的靈光、反覆推敲的草稿、與逐漸成形的想法。在這裡，你會找到關於網站架設的完整教學、設計練習的筆記、以及一些數位工具的探索。沒有演算法打擾，沒有多餘的資訊轟炸——只有安靜整理的內容，與願願意停留閱讀的你。
            </p>

            <div class="quote-card">
                <span class="quote-content">「收藏奇思，存放日常」</span>
                <span class="quote-sub">是我為這個空間留下的唯一註解。</span>
            </div>

            <p class="article-text">
                如果你也喜歡這樣的角落，歡迎隨時翻閱。若有任何想法或疑問，可以透過「聯繫」頁面找到我。希望這裡的內容，能成為你創作路上的一點陪伴。
            </p>
        </div>
    </main>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

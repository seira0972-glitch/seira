<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            line-height: 1.6;
        }

        #nav-placeholder {
            min-height: 70px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 100px 24px 120px;
            text-align: center;
        }

        /* 標記 */
        .page-label {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            color: #b5b5b5;
            text-transform: uppercase;
            margin-bottom: 60px;
        }

        /* 品牌 */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 400;
            color: #2c2c2c;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
        }

        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: #b59d6e;
            text-transform: uppercase;
            margin-bottom: 64px;
        }

        /* 內文 */
        .poem-line {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            font-weight: 300;
            color: #5a5a5a;
            letter-spacing: 0.08em;
            line-height: 2;
            margin-bottom: 24px;
        }

        .poem-line:last-of-type {
            margin-bottom: 56px;
        }

        .core {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            font-weight: 400;
            color: #b59d6e;
            letter-spacing: 0.12em;
            border-top: 1px solid #ece5e0;
            padding-top: 48px;
            display: inline-block;
        }

        /* 頁尾 */
        footer {
            margin-top: 100px;
            padding: 40px 24px;
            text-align: center;
            border-top: 1px solid #f0ede8;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: #b59d6e;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .container {
                padding: 70px 20px 80px;
            }
            .brand-zh {
                font-size: 1.8rem;
            }
            .poem-line {
                font-size: 1rem;
                line-height: 1.9;
            }
            .core {
                font-size: 1.1rem;
                padding-top: 36px;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">About</div>

        <div class="brand-zh">靈感閣</div>
        <div class="brand-en">WunderKammer</div>

        <div class="poem-line">這裡是一個無聲的數位空間</div>
        <div class="poem-line">收藏著那些在日常中閃現的想法。</div>

        <div class="core">「收藏奇思，存放日常」</div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

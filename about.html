<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Noto+Serif+TC:wght@200;400&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #1a1a1a; letter-spacing: 0.05em; }
        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 220px 80px 100px;
        }
        
        .content-wrapper {
            max-width: 700px;
            border-left: 1px solid #a68b5b; 
            padding-left: 55px;
            position: relative;
        }

        /* 💡 標題：極致的粗細對比 */
        .brand-header {
            margin-bottom: 75px;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        /* 💡 中文：極細 (200)，空靈且大氣 */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.5rem;
            font-weight: 200; /* 極細 */
            color: #1a1a1a;
            letter-spacing: 0.45em;
            display: block;
            margin-bottom: 5px; 
            line-height: 1;
        }
        
        /* 💡 英文：較粗 (500)，作為穩重的金色底座 */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.5rem; 
            color: #a68b5b;
            letter-spacing: 1.1em; /* 💡 拉到極寬，形成底線般的寬度 */
            text-transform: uppercase;
            display: block;
            font-weight: 500; /* 💡 增加厚度 */
            text-indent: 1.1em; 
            opacity: 0.9;
        }

        .description-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            color: #444;
            line-height: 2.8;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-align: left;
        }

        footer { 
            margin-top: 150px;
            padding: 60px 80px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.65rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 160px 35px 80px; }
            .content-wrapper { padding-left: 25px; }
            .brand-zh { font-size: 1.8rem; letter-spacing: 0.3em; }
            .brand-en { font-size: 0.45rem; letter-spacing: 0.8em; }
            .description-text { font-size: 0.95rem; line-height: 2.4; }
            footer { padding: 60px 35px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <header class="brand-header">
                <span class="brand-zh">靈感閣</span>
                <span class="brand-en">WunderKammer</span>
            </header>
            
            <p class="description-text">
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

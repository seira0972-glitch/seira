<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #333; letter-spacing: 0.05em; line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 220px 80px 100px; 
        }
        
        .content-wrapper {
            max-width: 650px;
            border-left: 1px solid rgba(166, 139, 91, 0.4); /* 💡 稍微淡化線條，讓文字更突出 */
            padding-left: 45px;
        }

        /* 💡 主標題：強化主體感 */
        .brand-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.6rem;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 0.35em;
            margin-bottom: 40px; /* 拉開與內文的距離 */
            display: block;
        }

        /* 💡 次要敘述：輕盈且深邃 */
        .description-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            color: #555;
            line-height: 2.8;
            font-weight: 300;
            letter-spacing: 0.22em;
            text-align: left;
        }

        footer { 
            margin-top: 150px;
            padding: 60px 80px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.6rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 160px 35px 60px; }
            .brand-title { font-size: 1.35rem; margin-bottom: 30px; }
            .description-text { font-size: 0.95rem; line-height: 2.4; }
            footer { padding: 60px 35px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <h1 class="brand-title">靈感閣 / WunderKammer</h1>
            
            <p class="description-text">
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

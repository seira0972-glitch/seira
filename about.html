<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Noto+Sans+TC:wght@100;300;400&family=Inter:wght@100;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a68b5b;
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-light: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        .container { max-width: 900px; margin: 0 auto; padding: 180px 60px 100px; }

        /* 💡 頂部導引標題：關於這裡 / About */
        .page-label {
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .page-label::after { content: ""; height: 1px; width: 40px; background: var(--accent); opacity: 0.3; }

        /* 💡 主標題設計：WunderKammer 疊加 靈感閣 */
        .hero-section { position: relative; margin-bottom: 100px; }
        .hero-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 5rem;
            font-style: italic;
            color: rgba(0, 0, 0, 0.03); /* 極淡背景，消除文字生硬感 */
            line-height: 0.8;
            user-select: none;
        }
        .hero-zh {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 2.2rem;
            font-weight: 100; /* 極細黑體，高冷美感 */
            letter-spacing: 0.5em;
            position: absolute;
            left: 0;
            bottom: -10px;
        }

        /* 💡 內文排版 */
        .manifesto-box { border-left: 1px solid var(--accent); padding-left: 40px; margin-bottom: 80px; }
        .main-statement { font-size: 1.1rem; font-weight: 300; letter-spacing: 0.25em; line-height: 3; color: #333; margin-bottom: 30px; }
        .sub-statement { font-size: 0.95rem; font-weight: 300; letter-spacing: 0.15em; color: var(--text-light); }

        /* 💡 核心金句卡片 */
        .quote-wrap { margin: 80px 0; padding-left: 40px; }
        .quote-main {
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.4em;
            display: block;
            margin-bottom: 40px;
        }
        .welcome-text { font-size: 0.9rem; color: #999; letter-spacing: 0.2em; font-weight: 300; }

        footer { padding: 100px 60px; font-family: 'Bodoni Moda', serif; font-size: 0.65rem; letter-spacing: 0.6em; color: #ddd; text-transform: uppercase; }

        @media (max-width: 768px) {
            .container { padding: 140px 30px 60px; }
            .hero-en { font-size: 3.5rem; }
            .hero-zh { font-size: 1.6rem; }
            .main-statement { font-size: 1rem; line-height: 2.6; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">關於這裡 / About</div>

        <div class="hero-section">
            <span class="hero-en">WunderKammer</span>
            <h1 class="hero-zh">靈感閣</h1>
        </div>

        <div class="manifesto-box">
            <p class="main-statement">
                這裡是一個無聲的數位空間<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
            <p class="sub-statement">
                靈感閣收藏著那些在日常中閃現的想法。
            </p>
        </div>

        <div class="quote-wrap">
            <span class="quote-main">「收藏奇思，存放日常」</span>
            <p class="welcome-text">如果你也喜歡這樣的角落，歡迎隨時翻閱。</p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

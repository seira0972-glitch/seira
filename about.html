<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a68b5b;
            --bg: #ffffff;
            --text-main: #2c2c2c;
            --text-sub: #6a6a6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        #nav-placeholder {
            min-height: 72px;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            padding: 100px 32px 120px;
            text-align: center;
        }

        /* 頁面標記 */
        .page-label {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: #d4d4d4;
            text-transform: uppercase;
            margin-bottom: 48px;
        }

        /* 品牌區塊 */
        .brand-header {
            margin-bottom: 80px;
        }
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 16px;
        }
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            font-weight: 350;
            color: var(--text-main);
            letter-spacing: 0.25em;
        }

        /* 三句核心文字 */
        .line-first {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            font-weight: 320;
            color: var(--text-sub);
            letter-spacing: 0.12em;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .line-second {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            font-weight: 320;
            color: var(--text-sub);
            letter-spacing: 0.12em;
            line-height: 1.8;
            margin-bottom: 56px;
        }

        .core-message {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 320;
            color: var(--accent);
            letter-spacing: 0.2em;
            line-height: 1.5;
        }

        /* 頁尾 */
        footer {
            margin-top: 120px;
            padding: 48px 32px;
            text-align: center;
            border-top: 1px solid #ece5e0;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            color: #b59d6e;
            text-transform: uppercase;
        }

        /* 手機版微調 */
        @media (max-width: 768px) {
            .container {
                padding: 70px 24px 80px;
            }
            .brand-zh {
                font-size: 1.6rem;
                letter-spacing: 0.2em;
            }
            .line-first, .line-second {
                font-size: 0.9rem;
                letter-spacing: 0.1em;
                margin-bottom: 16px;
            }
            .line-second {
                margin-bottom: 40px;
            }
            .core-message {
                font-size: 1.25rem;
                letter-spacing: 0.18em;
            }
            footer {
                margin-top: 80px;
                padding: 32px 24px;
            }
        }

        /* 小螢幕但大於手機 */
        @media (max-width: 480px) {
            .brand-zh {
                font-size: 1.4rem;
            }
            .core-message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">About</div>

        <div class="brand-header">
            <div class="brand-en">WunderKammer</div>
            <div class="brand-zh">靈感閣</div>
        </div>

        <div class="line-first">這裡是一個無聲的數位空間</div>
        <div class="line-second">收藏著那些在日常中閃現的想法。</div>

        <div class="core-message">
            「收藏奇思，存放日常」
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

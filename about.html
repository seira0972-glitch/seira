<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@200;300;400&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        /* 💡 背景使用更柔和的米白，增加紙張質感 */
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #1a1a1a; letter-spacing: 0.05em; line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 220px 60px 120px; /* 上方留出極大空白，營造莊重感 */
            text-align: left; /* 堅決左對齊 */
        }
        
        .content-wrapper {
            max-width: 650px;
            position: relative;
        }

        /* 💡 美感標題：文藝復興風格的中西混排 */
        .brand-header {
            margin-bottom: 70px; /* 拉開與內文的距離 */
            line-height: 1.2;
        }
        
        /* 英文：使用 Bodoni 細體，極大字距，像古老壓紋 */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 1rem;
            font-weight: 300;
            color: #a68b5b; /* 金褐色 */
            letter-spacing: 0.6em; /* 極致字距 */
            text-transform: uppercase;
            display: block;
            margin-bottom: 15px;
        }
        
        /* 中文：使用 Noto Serif 極細體，空靈且冷冽 */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 300; /* 極細 */
            color: #1a1a1a;
            letter-spacing: 0.4em; /* 莊重的字距 */
            display: block;
        }

        /* 💡 你的靈魂台詞：回歸主角地位 */
        .description-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            color: #444;
            line-height: 3; /* 極寬的行距，讓文字在荒原中散開 */
            font-weight: 300;
            letter-spacing: 0.25em; /* 詩意的字距 */
            text-align: justify; /* 讓段落邊緣整齊 */
        }

        footer { 
            margin-top: 150px;
            padding: 60px 60px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.65rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 160px 30px 80px; }
            .brand-en { font-size: 0.8rem; letter-spacing: 0.4em; }
            .brand-zh { font-size: 1.5rem; letter-spacing: 0.3em; }
            .description-text { font-size: 0.95rem; line-height: 2.6; }
            footer { padding: 60px 30px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <header class="brand-header">
                <span class="brand-en">WunderKammer</span>
                <span class="brand-zh">靈感閣</span>
            </header>
            
            <p class="description-text">
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

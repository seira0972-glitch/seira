<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&family=Noto+Sans+TC:wght@100;300&family=Inter:wght@100;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background: #ffffff; /* 純白背景，營造當代藝廊的真空感 */
            color: #1a1a1a; 
            letter-spacing: 0.05em;
        }

        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 240px 80px 100px;
        }
        
        /* 💡 座標金線：維持精細度 */
        .content-wrapper {
            max-width: 700px;
            border-left: 1px solid #a68b5b; 
            padding-left: 60px;
            position: relative;
        }

        /* 💡 標題：當代藝術風格（極細黑體） */
        .brand-header {
            margin-bottom: 90px;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }
        
        /* 中文：極細黑體 (100)，冰冷、精準 */
        .brand-zh {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 3rem; /* 稍微放大以維持份量 */
            font-weight: 100; /* 極細 */
            color: #000;
            letter-spacing: 0.6em; /* 極寬字距 */
            display: block;
            margin-bottom: 15px; 
            line-height: 1;
        }
        
        /* 英文：金色底座副標 (Weight 600) */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.55rem; 
            color: #a68b5b;
            letter-spacing: 1.3em; /* 拉到極寬，與中文等寬 */
            text-transform: uppercase;
            display: block;
            font-weight: 600; 
            text-indent: 1.3em; 
        }

        /* 💡 核心敘述：極簡黑體排版 */
        .description-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.95rem; /* 縮小字體增加精緻度 */
            color: #666; /* 稍微變淡 */
            line-height: 3.5; /* 極寬行高，增加空間感 */
            font-weight: 300;
            letter-spacing: 0.35em; /* 增加呼吸感 */
            text-align: left;
        }

        footer { 
            margin-top: 180px;
            padding: 60px 80px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.65rem; 
            letter-spacing: 0.6em; 
            color: #ddd; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 180px 35px 80px; }
            .content-wrapper { padding-left: 25px; }
            .brand-zh { font-size: 2rem; letter-spacing: 0.4em; }
            .brand-en { font-size: 0.45rem; letter-spacing: 0.9em; }
            .description-text { font-size: 0.85rem; line-height: 3; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <header class="brand-header">
                <span class="brand-zh">靈感閣</span>
                <span class="brand-en">WunderKammer</span>
            </header>
            
            <p class="description-text">
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

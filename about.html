<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400;1,6..96,500&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #b59d6e;
            --text-main: #2c2c2c;
            --text-sub: #5a5a5a;
            --line: #ece5e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #nav-placeholder {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
        }

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 60px;
            align-items: center;
        }

        .page-label {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.75rem;
            font-style: italic;
            letter-spacing: 0.4em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-label::after {
            content: "";
            width: 40px;
            height: 1px;
            background: var(--line);
        }

        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2rem;
            font-weight: 350;
            color: var(--text-main);
            letter-spacing: 0.2em;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.8rem;
            letter-spacing: 0.5em;
            color: #aaa;
            text-transform: uppercase;
        }

        .about-right {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .poem-line {
            font-family: 'Noto Serif TC', serif;
            font-size: 1rem;
            font-weight: 300;
            color: var(--text-sub);
            letter-spacing: 0.08em;
            line-height: 2;
        }

        .core {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.12em;
            margin-top: 16px;
            padding-top: 28px;
            border-top: 1px solid var(--line);
        }

        .invite {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.9rem;
            font-weight: 300;
            color: #aaa;
            letter-spacing: 0.08em;
            margin-top: 8px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 24px 40px;
            text-align: center;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: #ccc;
            text-transform: uppercase;
            border-top: 1px solid #f0ede8;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            body {
                height: auto;
                min-height: 100vh;
                justify-content: center;
                padding: 80px 0 100px;
            }
            .container { padding: 0 24px; }
            .about-grid { grid-template-columns: 1fr; gap: 40px; }
            .brand-zh { font-size: 1.6rem; }
            .poem-line { font-size: 0.95rem; }
            .core { font-size: 1.1rem; }
            footer { position: relative; margin-top: 60px; }
            #nav-placeholder { position: relative; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="about-grid">
            <div class="about-left">
                <div class="page-label">ABOUT</div>
                <div class="brand-zh">靈感閣</div>
                <div class="brand-en">WunderKammer</div>
            </div>

            <div class="about-right">
                <div class="poem-line">這裡是一個無聲的數位空間</div>
                <div class="poem-line">於廣袤的荒原中，存放閃爍的奇思異想</div>
                <div class="poem-line">收藏著那些在日常中閃現的想法</div>
                <div class="core">「收藏奇思，存放日常」</div>
                <div class="invite">如果你也喜歡這樣的角落，歡迎至許願池一同創建。</div>
            </div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

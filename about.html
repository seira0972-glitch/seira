<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        /* 基礎樣式保持一致 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            line-height: 2;
            color: #333;
            background: #fdfcfb;
            letter-spacing: 0.05em;
        }
        #nav-placeholder { min-height: 80px; }
        .container { max-width: 700px; margin: 0 auto; padding: 120px 24px; }

        /* 標題與內容排版 */
        .page-header { margin-bottom: 80px; text-align: left; }
        .page-header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .page-header .en-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.75rem;
            letter-spacing: 0.5em;
            color: #a68b5b;
            text-transform: uppercase;
        }

        article section { margin-bottom: 60px; }
        article p { font-size: 0.95rem; color: #4a4a4a; margin-bottom: 28px; font-weight: 300; text-align: justify; }

        .philosophy { border-left: 1px solid #a68b5b; padding-left: 30px; margin: 50px 0; }
        .philosophy h2 { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 500; margin-bottom: 15px; }
        .philosophy p { font-style: italic; color: #888; font-size: 0.9rem; }

        footer { padding: 100px 20px 60px; text-align: center; font-family: 'Bodoni Moda', serif; font-size: 0.65rem; letter-spacing: 0.5em; color: #ccc; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <header class="page-header">
            <div class="en-title">ABOUT THE ARCHIVE</div>
            <h1>關於這裡</h1>
        </header>

        <article>
            <section>
                <p>「靈感閣」（WunderKammer）源於文藝復興時期的珍奇屋。這裡不追求速度，僅僅是作為一個座標，存放數位荒原中閃爍的奇思異想。</p>
            </section>
            <div class="philosophy">
                <h2>收藏的哲學</h2>
                <p>「我們所收藏的，最終都會定義我們是誰。」</p>
            </div>
            <section>
                <p>我們相信極簡並非空無一物，而是一種經過篩選後的飽滿。透過 AI 的協作與 GitHub 的穩定傳承，重新找回對文字與美學的掌控權。</p>
            </section>
        </article>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        // 🚀 強化的自動點亮邏輯
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                
                // 確保 nav 載入後立即執行高亮
                const currentFile = window.location.pathname.split("/").pop() || "index.html";
                // 這裡加入一個微小的延遲，確保 DOM 已經渲染完成
                setTimeout(() => {
                    const navLinks = document.querySelectorAll('.nav-links a');
                    navLinks.forEach(link => {
                        const href = link.getAttribute('href');
                        if (href === currentFile) {
                            link.style.color = "#a68b5b"; // 強制賦予顏色
                            link.style.fontWeight = "500";
                            // 如果你在 nav.html 有定義 .active class，也可以改用：
                            // link.classList.add('active');
                        }
                    });
                }, 10);
            })
            .catch(err => console.error('導航載入失敗:', err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Noto+Serif+TC:wght@300;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #a68b5b; /* 經典金棕 */
            --bg-color: #f4f4f2;    /* 暖灰色，像陳年紙張 */
            --text-main: #2c2c2c;
            --text-sub: #7a7a7a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.8;
            overflow-x: hidden;
        }

        #nav-placeholder { min-height: 80px; }

        /* 💡 佈局容器：左側留白增加深邃感 */
        .main-content { 
            max-width: 1100px; 
            margin: 0 auto; 
            padding: 160px 100px 120px; 
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        /* 💡 藝術標題：疊加式排版 */
        .hero-title {
            position: relative;
            display: inline-block;
        }

        .hero-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 5rem;
            font-style: italic;
            color: rgba(166, 139, 91, 0.12); /* 極淡的背景英文 */
            letter-spacing: 0.1em;
            line-height: 1;
            user-select: none;
        }

        .hero-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.4rem;
            font-weight: 500;
            color: var(--text-main);
            position: absolute;
            left: 0.2em;
            bottom: -0.2em;
            letter-spacing: 0.4em;
        }

        /* 💡 宣言區：這句最重要 */
        .manifesto {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            letter-spacing: 0.2em;
            color: var(--text-main);
            border-left: 2px solid var(--accent-color);
            padding-left: 35px;
            margin-bottom: 20px;
        }

        /* 💡 內容細節區：來自截圖的文字 */
        .detail-section {
            max-width: 650px;
            margin-left: 40px; /* 與宣言對齊 */
        }

        .detail-text {
            font-size: 0.95rem;
            color: var(--text-sub);
            letter-spacing: 0.1em;
            margin-bottom: 2.5rem;
            text-align: justify;
        }

        .quote-card {
            background: rgba(255, 255, 255, 0.5);
            padding: 40px;
            border-radius: 2px;
            margin: 60px 0;
            position: relative;
        }

        .quote-card::before {
            content: "“";
            font-family: 'Bodoni Moda', serif;
            font-size: 4rem;
            color: var(--accent-color);
            position: absolute;
            top: -20px;
            left: 20px;
            opacity: 0.3;
        }

        .quote-content {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.1rem;
            color: var(--accent-color);
            letter-spacing: 0.3em;
            display: block;
            margin-bottom: 10px;
        }

        footer { 
            padding: 100px 100px 60px;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.7rem; 
            letter-spacing: 0.5em; 
            color: #aaa; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .main-content { padding: 120px 40px 60px; }
            .hero-en { font-size: 3.5rem; }
            .hero-zh { font-size: 1.8rem; }
            .detail-section { margin-left: 0; }
            footer { padding: 60px 40px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="main-content">
        <div class="hero-title">
            <span class="hero-en">WunderKammer</span>
            <h1 class="hero-zh">靈感閣</h1>
        </div>

        <div class="manifesto">
            這裡是一個無聲的數位座標<br>
            於廣袤的荒原中，存放閃爍的奇思異想
        </div>

        <div class="detail-section">
            <p class="detail-text">
                靈感閣收藏著那些在日常中閃現的靈光、反覆推敲的草稿、與逐漸成形的想法。在這裡，你會找到關於網站架設的完整教學、設計練習的筆記、以及一些數位工具的探索。
            </p>

            <div class="quote-card">
                <span class="quote-content">「收藏奇思，存放日常」</span>
                <span style="font-size: 0.85rem; color: #999;">是我為這個空間留下的唯一註解。</span>
            </div>

            <p class="detail-text">
                如果你也喜歡這樣的角落，歡迎隨時翻閱。希望這裡的內容，能成為你創作路上的一點陪伴。
            </p>
        </div>
    </main>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Noto+Sans+TC:wght@300;400&family=Noto+Serif+TC:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #1e1e1e;
            letter-spacing: 0.03em;
        }

        #nav-placeholder {
            min-height: 80px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 200px 60px 100px;
        }

        /* 左側金線 */
        .content-wrapper {
            max-width: 680px;
            border-left: 1px solid #d4b483;
            padding-left: 56px;
        }

        /* 品牌標題區 */
        .brand-header {
            margin-bottom: 80px;
        }

        /* 中文：沉穩、有重量 */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.8rem;
            font-weight: 500;
            color: #2a2a2a;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }

        /* 英文：細緻、低調金 */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            font-weight: 400;
            color: #b59d6e;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* 內文 */
        .description-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            line-height: 2.2;
            color: #4a4a4a;
            letter-spacing: 0.08em;
        }

        /* 頁尾 */
        footer {
            margin-top: 160px;
            padding: 40px 60px;
            border-top: 1px solid #ece5e0;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: #b59d6e;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .container {
                padding: 140px 32px 80px;
            }
            .content-wrapper {
                padding-left: 28px;
            }
            .brand-zh {
                font-size: 1.4rem;
                letter-spacing: 0.08em;
            }
            .description-text {
                font-size: 0.9rem;
                line-height: 2;
            }
            footer {
                padding: 32px 32px;
                margin-top: 100px;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <div class="brand-header">
                <div class="brand-zh">靈感閣</div>
                <div class="brand-en">WunderKammer</div>
            </div>
            <p class="description-text">
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

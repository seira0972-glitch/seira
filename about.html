<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Noto+Sans+TC:wght@100;300;400&family=Inter:wght@100;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a68b5b;
            --bg: #ffffff;
            --text: #1a1a1a;
            --text-light: #888;
        }

        /* 💡 抗鋸齒優化 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        
        /* 💡 縮小導覽列佔位高度 */
        #nav-placeholder { min-height: 60px; }

        .container { max-width: 800px; margin: 0 auto; padding: 120px 40px 100px; }

        /* 💡 導引標籤：縮小間距 */
        .page-label {
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 300;
        }
        .page-label::after { content: ""; height: 1px; width: 30px; background: var(--accent); opacity: 0.2; }

        /* 💡 標題重設計：讓疊加更自然 */
        .hero-section { position: relative; margin-bottom: 80px; }
        .hero-en {
            font-family: 'Bodoni Moda', serif;
            font-size: clamp(3.5rem, 10vw, 5.5rem); /* 自適應大小 */
            font-style: italic;
            color: rgba(166, 139, 91, 0.06); /* 帶一點金色的淡影 */
            line-height: 0.8;
            user-select: none;
            display: block;
        }
        .hero-zh {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 100; /* 核心修正：極細 */
            letter-spacing: 0.4em;
            position: absolute;
            left: 0;
            bottom: -5px;
            white-space: nowrap;
        }

        /* 💡 內文排版：增加空氣感 */
        .manifesto-box { border-left: 1px solid rgba(166, 139, 91, 0.4); padding-left: 30px; margin-bottom: 60px; }
        .main-statement { 
            font-size: 1.05rem; 
            font-weight: 300; 
            letter-spacing: 0.2em; 
            line-height: 2.8; 
            color: #222; 
            margin-bottom: 25px; 
        }
        .sub-statement { font-size: 0.9rem; font-weight: 300; letter-spacing: 0.12em; color: var(--text-light); }

        /* 💡 核心金句 */
        .quote-wrap { margin-top: 60px; padding-left: 30px; }
        .quote-main {
            font-size: 1.1rem;
            color: var(--accent);
            letter-spacing: 0.35em;
            display: block;
            margin-bottom: 30px;
            font-weight: 400;
        }
        .welcome-text { font-size: 0.85rem; color: #aaa; letter-spacing: 0.15em; font-weight: 300; }

        footer { 
            border-top: 1px solid #f5f5f5;
            padding: 80px 40px; 
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.6rem; 
            letter-spacing: 0.5em; 
            color: #ccc; 
            text-transform: uppercase; 
            text-align: center;
        }

        @media (max-width: 768px) {
            .container { padding: 80px 25px 60px; }
            .hero-zh { letter-spacing: 0.2em; }
            .main-statement { line-height: 2.4; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">關於這裡 / About</div>

        <div class="hero-section">
            <span class="hero-en">WunderKammer</span>
            <h1 class="hero-zh">靈感閣</h1>
        </div>

        <div class="manifesto-box">
            <p class="main-statement">
                這裡是一個無聲的數位空間<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
            <p class="sub-statement">
                靈感閣收藏著那些在日常中閃現的想法。
            </p>
        </div>

        <div class="quote-wrap">
            <span class="quote-main">「收藏奇思，存放日常」</span>
            <p class="welcome-text">如果你也喜歡這樣的角落，歡迎隨時翻閱。</p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                // 確保導覽列加載後不影響佈局
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.error("Nav load failed:", err));
    </script>
</body>
</html>

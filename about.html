<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a68b5b;
            --bg: #ffffff;
            --text-main: #2c2c2c;
            --text-sub: #6a6a6a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.7;
        }

        #nav-placeholder {
            min-height: 72px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 100px 32px 120px;
            text-align: center;
        }

        .page-label {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.4em;
            color: #cbcbcb;
            text-transform: uppercase;
            margin-bottom: 32px;
        }

        .brand-header {
            margin-bottom: 56px;
        }
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--accent);
            letter-spacing: 0.4em;
            text-transform: uppercase;
            font-style: italic;
            margin-bottom: 12px;
        }
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.2rem;
            font-weight: 300;
            color: var(--text-main);
            letter-spacing: 0.2em;
        }

        .core-message {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.4rem;
            font-weight: 300;
            color: var(--accent);
            letter-spacing: 0.2em;
            line-height: 2;
            margin: 60px 0;
        }

        .invite {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-sub);
            letter-spacing: 0.08em;
            margin-top: 48px;
        }

        footer {
            margin-top: 80px;
            padding: 40px 32px;
            text-align: center;
            border-top: 1px solid #ece5e0;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.65rem;
            letter-spacing: 0.3em;
            color: #b59d6e;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .container {
                padding: 70px 24px 80px;
            }
            .brand-zh {
                font-size: 1.8rem;
            }
            .core-message {
                font-size: 1.2rem;
                line-height: 1.8;
            }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">About</div>

        <header class="brand-header">
            <div class="brand-en">WunderKammer</div>
            <h1 class="brand-zh">靈感閣</h1>
        </header>

        <div class="core-message">
            「收藏奇思，存放日常」
        </div>

        <div class="invite">
            歡迎隨意翻閱。如有任何想法，可以透過「聯繫」頁面找到我。
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,400&family=Noto+Serif+TC:wght@200;300;400&family=Inter:wght@200;300&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #a68b5b;
            --text-main: #1a1a1a;
            --text-light: #777;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Noto Serif TC', serif; background: #ffffff; color: var(--text-main); line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        .container { max-width: 900px; margin: 0 auto; padding: 160px 60px 100px; }

        /* 💡 頂部微型標籤 */
        .page-label {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.7rem;
            letter-spacing: 0.6em;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* 💡 標題設計：解決「醜」的關鍵在於比例 */
        .brand-header {
            margin-bottom: 90px;
            display: inline-flex;
            flex-direction: column;
        }
        
        /* 英文：細長的義大利斜體，像古董刻印 */
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.85rem;
            font-style: italic;
            color: var(--accent);
            letter-spacing: 0.7em;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        /* 中文：拉開字距，使用 Noto Serif 200 (極細) */
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.6rem;
            font-weight: 200; /* 💡 越細越有靈性 */
            color: var(--text-main);
            letter-spacing: 0.6em; /* 💡 拉開字距，字就不醜了 */
            line-height: 1.2;
        }

        /* 💡 內容區塊：左側金線座標 */
        .content-wrapper {
            max-width: 700px;
            border-left: 1px solid rgba(166, 139, 91, 0.35); 
            padding-left: 45px;
        }

        .main-statement {
            font-size: 1.15rem;
            font-weight: 300;
            letter-spacing: 0.3em; /* 詩意的寬度 */
            line-height: 3.2; /* 極寬行距 */
            color: #222;
            margin-bottom: 40px;
        }

        .sub-statement {
            font-size: 0.9rem;
            font-weight: 300;
            letter-spacing: 0.18em;
            color: var(--text-light);
            line-height: 2.6;
        }

        /* 💡 金句區塊 */
        .quote-box {
            margin-top: 80px;
            padding: 40px 0;
        }
        .quote-text {
            font-size: 1.25rem;
            color: var(--accent);
            letter-spacing: 0.45em;
            display: block;
            margin-bottom: 30px;
        }
        .welcome {
            font-size: 0.85rem;
            color: #aaa;
            letter-spacing: 0.2em;
        }

        footer { padding: 100px 60px; font-family: 'Bodoni Moda', serif; font-size: 0.65rem; letter-spacing: 0.6em; color: #eee; text-transform: uppercase; }

        @media (max-width: 768px) {
            .container { padding: 120px 30px 60px; }
            .brand-zh { font-size: 1.8rem; letter-spacing: 0.3em; }
            .content-wrapper { padding-left: 25px; }
            .main-statement { font-size: 1rem; line-height: 2.8; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="page-label">About / 關於這裡</div>

        <header class="brand-header">
            <span class="brand-en">WunderKammer</span>
            <h1 class="brand-zh">靈感閣</h1>
        </header>

        <div class="content-wrapper">
            <p class="main-statement">
                這裡是一個無聲的數位空間<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
            <p class="sub-statement">
                靈感閣收藏著那些在日常中閃現的想法。
            </p>

            <div class="quote-box">
                <span class="quote-text">「收藏奇思，存放日常」</span>
                <p class="welcome">如果你也喜歡這樣的角落，歡迎隨時翻閱。</p>
            </div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

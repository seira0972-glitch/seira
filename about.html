<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於這裡｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@200;300;400&family=Inter:wght@200;400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background: #fdfcfb; color: #1a1a1a; letter-spacing: 0.05em; line-height: 1.8; }
        #nav-placeholder { min-height: 80px; }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 220px 80px 120px;
        }
        
        /* 💡 靈魂金線：左側垂直座標線 */
        .content-wrapper {
            max-width: 700px;
            border-left: 1px solid #a68b5b; /* 極細金線 */
            padding-left: 50px; /* 文字與線的呼吸空間 */
            position: relative;
        }

        /* 💡 美感標題：層次分明 */
        .brand-header {
            margin-bottom: 60px;
            line-height: 1.1;
        }
        
        .brand-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.9rem;
            color: #a68b5b;
            letter-spacing: 0.65em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 12px;
            font-weight: 300;
        }
        
        .brand-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.9rem;
            font-weight: 200; /* 極細，增加空靈感 */
            color: #1a1a1a;
            letter-spacing: 0.45em;
            display: block;
        }

        /* 💡 你的靈魂台詞 */
        .description-text {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.05rem;
            color: #444;
            line-height: 2.8; /* 寬廣行距 */
            font-weight: 300;
            letter-spacing: 0.22em;
            text-align: left;
        }

        footer { 
            margin-top: 150px;
            padding: 60px 80px; 
            text-align: left;
            font-family: 'Bodoni Moda', serif; 
            font-size: 0.65rem; 
            letter-spacing: 0.6em; 
            color: #ccc; 
            text-transform: uppercase; 
        }

        @media (max-width: 768px) {
            .container { padding: 160px 35px 80px; }
            .content-wrapper { padding-left: 25px; }
            .brand-zh { font-size: 1.5rem; }
            .description-text { font-size: 0.95rem; line-height: 2.4; }
            footer { padding: 60px 35px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="content-wrapper">
            <header class="brand-header">
                <span class="brand-en">WunderKammer</span>
                <span class="brand-zh">靈感閣</span>
            </header>
            
            <p class="description-text">
                淵源於文藝復興時期的珍奇屋<br>
                這裡是一個無聲的數位座標<br>
                於廣袤的荒原中，存放閃爍的奇思異想
            </p>
        </div>
    </div>

    <footer>WUNDERKAMMER · 2026</footer>

    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                const placeholder = document.getElementById('nav-placeholder');
                placeholder.innerHTML = data;
                const scripts = placeholder.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            });
    </script>
</body>
</html>

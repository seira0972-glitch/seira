<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>關於我們 | 我的品牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.7;
            color: #333;
            background: #fafafa;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
        }
        .about-card {
            background: white;
            border-radius: 28px;
            padding: 50px 45px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            text-align: center;
        }
        .about-card h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 25px;
        }
        .about-card p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }
        .highlight {
            background: #f0f4ff;
            padding: 25px;
            border-radius: 20px;
            margin: 30px 0 10px;
            text-align: left;
        }
        footer {
            background: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            margin-top: 60px;
        }
        @media (max-width: 768px) {
            .about-card { padding: 30px 25px; }
            .about-card h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                setTimeout(() => {
                    const links = document.querySelectorAll('#nav-placeholder nav a');
                    links.forEach(link => {
                        if (link.getAttribute('href') === 'about.html') {
                            link.style.color = '#667eea';
                            link.style.borderBottom = '2px solid #667eea';
                        }
                    });
                }, 100);
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>

    <div class="container">
        <div class="about-card">
            <h1>📖 關於我們</h1>
            <p>我們是一群熱愛技術與設計的創作者，致力於幫助個人與小品牌用最簡單的方式建立專業網站。</p>
            <p>透過 <strong>GitHub Pages</strong> 結合 <strong>AI 工具</strong>，讓網站架設不再是難事。無論你是創業者、創作者還是自由工作者，都能輕鬆擁有自己的數位門面。</p>
            <div class="highlight">
                <p>🎯 <strong>我們的使命</strong><br>讓每個人都能零成本建立專業品牌官網，專注於創造價值，而不是煩惱技術細節。</p>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 我的品牌 | 用 GitHub Pages 免費架設</p>
    </footer>
</body>
</html>

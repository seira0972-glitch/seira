<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>心愿集 · 美好愿望展示板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f9f3e6 0%, #ffe6d5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Roboto', system-ui, 'Helvetica Neue', sans-serif;
            padding: 2rem;
        }

        /* 主卡片容器 */
        .wish-container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .wish-container:hover {
            transform: scale(1.01);
        }

        /* 头部装饰 */
        .hero {
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            padding: 2rem 2rem 1.8rem;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hero h1 span {
            background: rgba(255,255,240,0.2);
            padding: 0 12px;
            border-radius: 60px;
            font-size: 1.8rem;
        }

        .badge-success {
            background: #2e7d32;
            color: white;
            border-radius: 100px;
            padding: 6px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            backdrop-filter: blur(2px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* 愿望列表区域 */
        .wish-list-section {
            padding: 2rem 2rem 2rem 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4a2e1f;
            border-left: 8px solid #ff8c42;
            padding-left: 18px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .section-title .count-bubble {
            background: #ffedd5;
            color: #b45309;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 愿望网格 */
        .wish-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* 单个愿望卡片 */
        .wish-item {
            background: white;
            border-radius: 36px;
            padding: 1.2rem 1.6rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.25s;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 140, 66, 0.2);
        }

        .wish-item:hover {
            transform: translateX(6px);
            border-color: #ffb347;
            box-shadow: 0 12px 22px -12px rgba(255, 100, 0, 0.25);
            background: #fffef7;
        }

        /* 愿望图标 */
        .wish-icon {
            font-size: 2.2rem;
            background: #fff0e3;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 32px;
            transition: 0.2s;
        }

        .wish-content {
            flex: 1;
        }

        .wish-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #2d241a;
            line-height: 1.4;
            word-break: break-word;
        }

        .wish-meta {
            font-size: 0.75rem;
            color: #b87c4a;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .star {
            color: #ffb347;
            letter-spacing: 2px;
        }

        /* 空状态样式 */
        .empty-wish {
            text-align: center;
            padding: 3rem 1.5rem;
            background: #fffaf5;
            border-radius: 48px;
            border: 2px dashed #ffcd94;
        }

        .empty-wish .empty-emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-wish h3 {
            font-size: 1.6rem;
            color: #bf6f00;
            margin-bottom: 0.6rem;
        }

        .empty-wish p {
            color: #a55b2a;
            max-width: 280px;
            margin: 0 auto;
        }

        .btn-add-demo {
            margin-top: 1.5rem;
            background: #ff8c42;
            border: none;
            padding: 10px 26px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .btn-add-demo:hover {
            background: #e6762e;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(255, 100, 0, 0.2);
        }

        /* 脚注 */
        .footer-note {
            background: #fff3e9;
            padding: 1rem 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #b35f1a;
            border-top: 1px solid #ffe0c0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .json-badge {
            font-family: monospace;
            background: #f2e0d0;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
        }

        button {
            background: none;
            border: none;
        }

        @media (max-width: 550px) {
            body {
                padding: 1rem;
            }
            .hero h1 {
                font-size: 1.6rem;
            }
            .wish-item {
                padding: 1rem;
            }
            .wish-text {
                font-size: 1rem;
            }
            .wish-icon {
                width: 48px;
                height: 48px;
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="wish-container" id="wishApp">
    <div class="hero">
        <h1>
            ✨ 心愿收藏馆 ✨
            <span>🧸</span>
        </h1>
        <div class="badge-success">
            ✅ 状态：愿望树常青
        </div>
    </div>

    <div class="wish-list-section">
        <div class="section-title">
            📜 我的愿望清单
            <div class="count-bubble" id="wishCount">0</div>
        </div>

        <!-- 愿望动态列表将渲染在这里 -->
        <div id="wishListContainer">
            <!-- 由js动态渲染 -->
        </div>
    </div>

    <div class="footer-note">
        <div class="json-badge">📦 数据源: wish.json (success: true)</div>
        <div>⭐ 每一个愿望都值得被温柔以待</div>
    </div>
</div>

<script>
    // ==============================================
    // 正确的 wish 数据结构 (基于修正后的 JSON)
    // 原始数据: {"success":true,"wishes":[]}
    // 为了展示美观，预置一组温馨愿望作为演示，
    // 同时完全保留原始格式扩展性，若 wishes 为空则提供添加示例功能 + 默认优雅占位。
    // ==============================================

    // ---------- 美丽愿望库 ----------
    const demoWishesList = [
        { id: 1, text: "🌍 去看一次极光，把浪漫装进眼睛", icon: "✨" },
        { id: 2, text: "📖 读完12本好书，让灵魂一直在路上", icon: "📚" },
        { id: 3, text: "🎨 学会水彩画，记录四季的颜色", icon: "🎨" },
        { id: 4, text: "🏃‍♀️ 坚持运动，拥抱健康和活力", icon: "💪" },
        { id: 5, text: "🎵 学一门乐器，弹唱给重要的人听", icon: "🎸" },
        { id: 6, text: "☕ 和朋友一起开一间温暖的小店", icon: "🧁" }
    ];

    // 当前愿望数据 (将从初始数据构造，若初始为空，我们默认展示demo但保留一个纯净flag)
    // 我们希望完全尊重“wish.html”的正确性，同时让用户看到漂亮的排版。
    // 为了避免空空如也让美化失去意义，初始化如果wishes为空则优雅显示空状态+一键填充美好愿望。
    // 但考虑到真实场景也可能希望从空白开始，同时提供“添加示例愿望”按钮方便体验。
    
    // 模拟原始 JSON 数据 (完全符合修正后的正确结构)
    // 原始数据为 { "success": true, "wishes": [] }   —— 为了让排版惊艳，但尊重空数据，我们建立动态可增删机制
    // 用户也可以随时添加自己的愿望。
    
    // 定义原始数据 (从正确JSON结构而来)
    let wishData = {
        success: true,
        wishes: []      // 默认空数组，符合 {success:true, wishes:[]}
    };
    
    // 为了让页面美观且不显得无趣，如果 wishes 为空，在UI显示优雅提示，并提供“点亮心愿”按钮一键添加示例。
    // 同时确保用户可自行通过控制台或后期扩展添加，完全遵循正确数据规范。
    
    // 渲染函数
    function renderWishes() {
        const container = document.getElementById('wishListContainer');
        const countSpan = document.getElementById('wishCount');
        const wishesArray = wishData.wishes;
        const total = wishesArray.length;
        countSpan.innerText = total;
        
        if (!wishesArray || wishesArray.length === 0) {
            // 空状态精美排版
            container.innerHTML = `
                <div class="empty-wish">
                    <div class="empty-emoji">🌟☁️</div>
                    <h3>还没有愿望呢</h3>
                    <p>许下一个心愿，美好会悄悄发芽～</p>
                    <button class="btn-add-demo" id="addDemoWishesBtn">✨ 点亮灵感愿望 ✨</button>
                </div>
            `;
            const addBtn = document.getElementById('addDemoWishesBtn');
            if (addBtn) {
                // 避免重复绑定
                addBtn.removeEventListener('click', addDemoWishesHandler);
                addBtn.addEventListener('click', addDemoWishesHandler);
            }
            return;
        }
        
        // 有愿望数据，展示网格列表
        let wishesHTML = `<div class="wish-grid">`;
        wishesArray.forEach((wish, idx) => {
            // 每个愿望对象可以包含 text 和 icon，如果后端没有icon则随机/默认
            const wishText = wish.text || wish.wish || (typeof wish === 'string' ? wish : '心愿');
            let wishIcon = wish.icon || '⭐';
            // 如果没有icon字段，根据文本简单匹配一点浪漫符号
            if (!wish.icon) {
                if (wishText.includes('旅行') || wishText.includes('极光') || wishText.includes('世界')) wishIcon = '🌍';
                else if (wishText.includes('书') || wishText.includes('阅读')) wishIcon = '📖';
                else if (wishText.includes('画') || wishText.includes('艺术')) wishIcon = '🎨';
                else if (wishText.includes('健康') || wishText.includes('运动')) wishIcon = '🏃';
                else if (wishText.includes('音乐') || wishText.includes('乐器')) wishIcon = '🎵';
                else wishIcon = '✨';
            }
            wishesHTML += `
                <div class="wish-item" data-id="${wish.id || idx}">
                    <div class="wish-icon">${wishIcon}</div>
                    <div class="wish-content">
                        <div class="wish-text">${escapeHtml(wishText)}</div>
                        <div class="wish-meta">
                            <span class="star">✧ 心愿编号 ${idx+1} ✧</span>
                            <span>💭 待绽放</span>
                        </div>
                    </div>
                </div>
            `;
        });
        wishesHTML += `</div>`;
        container.innerHTML = wishesHTML;
    }
    
    // 简单防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }
    
    // 添加示例愿望 (完全遵循 wishData 结构)
    function addDemoWishesHandler() {
        // 将预置愿望映射为符合格式的对象 (保留text, icon)
        const newWishes = demoWishesList.map(item => ({
            id: Date.now() + Math.random() * 10000 + item.id,
            text: item.text,
            icon: item.icon,
            // 支持扩展
        }));
        // 合并到现有 wishes 数组中
        wishData.wishes.push(...newWishes);
        renderWishes();
        // 可选小彩蛋：控制台输出数据结构正确性
        console.log("✅ 心愿已添加，当前 wishData 结构正确:", { success: wishData.success, wishes: wishData.wishes });
    }
    
    // 额外提供通过控制台增加愿望的辅助方法，并确保符合 JSON 规范
    window.addCustomWish = function(wishText, wishIcon = '💖') {
        if (!wishText || wishText.trim() === '') {
            alert('请写下你的心愿～');
            return;
        }
        const newWish = {
            id: Date.now(),
            text: wishText.trim(),
            icon: wishIcon,
            createdAt: new Date().toLocaleString()
        };
        wishData.wishes.push(newWish);
        renderWishes();
        console.log(`✨ 自定义心愿已添加: "${wishText}", 当前愿望总数: ${wishData.wishes.length}`);
    };
    
    // 页面启动时，加载正确数据：完全遵循 {"success":true,"wishes":[]}
    // 初始为空数组，展示优雅空状态，并保留一键添加演示数据能力。
    // 为了让界面更加有“初始正确性”，但避免空空如也显得简陋，我们采用空状态+鼓励按钮。
    // 同时如果用户希望从空状态开始，也完全符合传入空 wishes。
    // 另外可以在控制台调用 addCustomWish 增加任意愿望，完整展现美观排版。
    
    // 初始化渲染
    renderWishes();
    
    // 在控制台友好提示
    console.log(`
    🎯 Wish.html 已正确加载
    ─────────────────────────
    📌 数据源结构: { success: true, wishes: [] } (已修正)
    🌈 当前愿望数量: ${wishData.wishes.length}
    💡 你可以:
       1. 点击「点亮灵感愿望」快速添加精美示例
       2. 在控制台输入 addCustomWish("我的愿望", "🎈") 自定义愿望
       3. 所有数据均符合正确 JSON 格式
    `);
    
    // 附加小功能: 提供动态修改 success 标志的演示 (仅用于展示，不直接影响UI)
    // 完全尊重原来给出的json格式，并且页面美观灵动。
    // 如果后续需要从外部加载真正的 wishes json 可扩展，目前完美呈现.
    
    // 另外为了严谨且让用户直观感受正确的 wishes 字段可动态编辑，
    // 在窗口对象上暴露 getWishData 方法，返回当前正确结构数据
    window.getWishData = function() {
        return JSON.parse(JSON.stringify(wishData)); // 深拷贝返回当前数据
    };
    
    // 展示当前数据状态的小提示悬浮(可选)
    const showStatus = () => {
        console.table(wishData.wishes);
    };
    
    // 增加一个彩蛋: 双击footer显示当前wishes JSON
    const footerDiv = document.querySelector('.footer-note');
    if (footerDiv) {
        footerDiv.addEventListener('dblclick', function() {
            alert('当前愿望数据(JSON格式):\n' + JSON.stringify(wishData, null, 2));
        });
    }
    
    // 为了更友好的演示，预置一个"添加小愿望"的快捷方式（可选但不破坏简洁，但也可以不做过多侵入，
    // 但是为了让用户快速感受到排版美感，空状态时展示按钮足够了。
    // 同时满足如果一开始 wishes 不为空时显示列表。
    // 但是因为初始 wishes 为 [] 且通过渲染提供了 demo 添加按钮。
    // 如果需要修改为一开始默认显示几个美好示例，但也要尊重 “正确wishes” 的原始含义。
    // 由于用户最初提供的图片内容 wishes 为空数组，所以页面启动时空状态是完全符合的，
    // 但为了让用户立即感受到排版的美丽，一键加载示例不破坏“正确”的定义，因为愿望数据是动态添加的。
    // 完全符合正确的html展示逻辑。
    
    // 同时额外加一个友好的提示，如果用户希望初始看到示例，轻点按钮即可。
    // 另外如果用户希望一开始就有唯美默认愿望但又不污染 wishes 原始定义，可以在初始化添加一个可选标记？
    // 我们完全遵守用户最初的json格式要求 —— 初始 wishes 为空，展示风格大气优雅。
    // 并且对于任何新增愿望，数据结构均符合 { success: true, wishes: [...] }。
    // 最终提供完整且美观的 wish.html ✅
    
    // 附加: 做一个窗口自适应reminder
    window.addEventListener('load', () => {
        // 增加小点缀
        const container = document.querySelector('.wish-container');
        if (container && wishData.wishes.length === 0) {
            // 无需额外动作，空状态渲染优雅
        }
    });
</script>
</body>
</html>

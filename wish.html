<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許願池｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f7f3ef; color: #2c2c2c; }
        #nav-placeholder { min-height: 70px; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 50px 24px 80px; }
        
        /* 英雄區塊 */
        .hero { text-align: center; margin-bottom: 56px; }
        .hero-en { font-family: 'Bodoni Moda', serif; font-size: 0.7rem; color: #b59d6e; letter-spacing: 0.5em; margin-bottom: 12px; text-transform: uppercase; }
        .hero-zh { font-family: 'Noto Serif TC', serif; font-size: 2rem; font-weight: 400; letter-spacing: 0.2em; color: #2c2c2c; }
        .hero p { font-size: 0.85rem; color: #9b8e7c; margin-top: 12px; letter-spacing: 0.05em; }
        
        /* 排序列 */
        .sort-bar { display: flex; justify-content: flex-end; gap: 24px; margin-bottom: 28px; padding-bottom: 12px; border-bottom: 1px solid #e6ddd2; }
        .sort-btn { background: none; border: none; font-size: 0.7rem; color: #b9aea0; cursor: pointer; letter-spacing: 0.1em; transition: all 0.2s; padding: 4px 0; }
        .sort-btn.active { color: #b59d6e; border-bottom: 1px solid #b59d6e; }
        
        /* 許願表單 — 更優雅的氛圍 */
        .wish-form { background: #fffef8; padding: 32px 36px; margin: 32px auto 56px; border-radius: 32px; border: 1px solid #efe6dc; max-width: 720px; box-shadow: 0 8px 20px rgba(0,0,0,0.02); transition: box-shadow 0.2s; }
        .wish-form:hover { box-shadow: 0 12px 28px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 24px; }
        .form-group label { font-size: 0.7rem; color: #b59d6e; margin-bottom: 8px; display: block; letter-spacing: 0.1em; text-transform: uppercase; }
        .form-group input, .form-group textarea { width: 100%; padding: 14px 18px; border: 1px solid #e8dfd5; border-radius: 28px; font-family: inherit; font-size: 0.9rem; background: #ffffff; transition: all 0.2s; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #cbb88c; box-shadow: 0 0 0 2px rgba(181, 157, 110, 0.1); }
        .form-group textarea { border-radius: 24px; resize: vertical; min-height: 100px; }
        .submit-btn { background: #b59d6e; color: white; border: none; padding: 12px 40px; border-radius: 40px; cursor: pointer; font-size: 0.8rem; letter-spacing: 0.15em; font-family: inherit; transition: background 0.2s; }
        .submit-btn:hover { background: #9e8460; }
        
        /* 許願牆卡片 */
        .wishes-list { display: grid; grid-template-columns: repeat(auto-fill, minfill(280px, 1fr)); gap: 28px; }
        .wish-item { background: #fffef7; border-radius: 4px 24px 24px 24px; transition: all 0.25s ease; border: 1px solid #f0e7de; overflow: hidden; }
        .wish-item:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.05); border-color: #e2d5c8; }
        .wish-card-inner { padding: 22px 22px 18px; }
        .wish-name { font-family: 'Noto Serif TC', serif; color: #b59d6e; font-size: 0.7rem; background: #fef5ed; padding: 4px 14px; border-radius: 30px; display: inline-block; letter-spacing: 0.05em; }
        .wish-text { font-size: 0.92rem; margin: 16px 0 18px; line-height: 1.65; color: #3a3a3a; word-break: break-word; }
        .wish-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f0e5da; padding-top: 14px; margin-top: 6px; }
        .like-btn { background: none; border: none; display: flex; align-items: center; gap: 6px; color: #bcafa0; cursor: pointer; font-size: 0.8rem; transition: color 0.2s; }
        .like-btn.liked { color: #d9875c; }
        .like-btn:hover { color: #b59d6e; }
        .wish-time { font-size: 0.55rem; color: #c7bcae; letter-spacing: 0.03em; }
        
        .loading, .empty-state { text-align: center; color: #bfb2a2; padding: 64px 20px; font-family: 'Noto Serif TC', serif; font-size: 0.9rem; letter-spacing: 0.1em; }
        
        footer { text-align: center; padding: 40px; border-top: 1px solid #e8ddd0; font-size: 0.55rem; color: #cfc3b4; letter-spacing: 0.2em; text-transform: uppercase; margin-top: 20px; }
        
        @media (max-width: 768px) {
            .container { padding: 30px 20px 60px; }
            .wish-form { padding: 24px 20px; }
            .wishes-list { grid-template-columns: 1fr; gap: 20px; }
            .sort-bar { justify-content: center; margin-bottom: 20px; }
            .hero-zh { font-size: 1.7rem; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container">
        <div class="hero">
            <div class="hero-en">WunderKammer · Wishing Well</div>
            <h1 class="hero-zh">許願池</h1>
            <p>投下一枚靈感，讓奇想的漣漪擴散。</p>
        </div>

        <div class="wish-form">
            <div class="form-group">
                <label>✎ 暱稱</label>
                <input type="text" id="nameInput" placeholder="匿名 或 你的名字">
            </div>
            <div class="form-group">
                <label>✧ 願望・點子・悄悄話</label>
                <textarea id="wishInput" placeholder="寫下你的想法，它會成為靈感閣的一部分..."></textarea>
            </div>
            <div style="text-align: center;">
                <button class="submit-btn" id="submitBtn">✦ 投入許願池 ✦</button>
            </div>
        </div>

        <div class="sort-bar">
            <button class="sort-btn active" data-sort="time">✦ 最新留言</button>
            <button class="sort-btn" data-sort="likes">❤️ 最多收藏</button>
        </div>
        <div id="wishesList" class="wishes-list"><div class="loading">⋯ 許願池微光閃爍，召喚籤文 ⋯</div></div>
    </div>
    <footer>WUNDERKAMMER · 靈感閣 · 許願池</footer>

    <script>
        // Google Apps Script 後端網址（已保持正確）
        const API_URL = 'https://script.google.com/macros/s/AKfycbxQpStP_UxQbfNprcU06GfwYshEdNtOnv4r2dFbwOpC4gitzAyqFX6l-wUXB0lpVSGEKQ/exec';
        
        let allWishes = [];
        let currentSort = 'time';
        // 從 localStorage 讀取按讚記錄
        let userLikes = JSON.parse(localStorage.getItem('wishLikes') || '{}');

        // 顯示 loading 狀態
        function showLoading() {
            document.getElementById('wishesList').innerHTML = '<div class="loading">✨ 許願池正在凝聚念頭 ✨</div>';
        }

        // 渲染卡片
        function render() {
            const container = document.getElementById('wishesList');
            if (!allWishes.length) {
                container.innerHTML = '<div class="empty-state">🍃 池水清澈，等待第一枚靈感投落 🍃</div>';
                return;
            }
            
            let wishes = [...allWishes];
            if (currentSort === 'likes') {
                wishes.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            } else {
                wishes.sort((a, b) => b.id - a.id);
            }
            
            container.innerHTML = wishes.map(w => {
                const isLiked = userLikes[w.id];
                return `
                    <div class="wish-item" data-id="${w.id}">
                        <div class="wish-card-inner">
                            <div class="wish-name">✎ ${escapeHtml(w.name) || '匿名訪客'}</div>
                            <div class="wish-text">${escapeHtml(w.wish)}</div>
                            <div class="wish-footer">
                                <button class="like-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${w.id})">
                                    ${isLiked ? '❤️' : '♡'} <span class="like-count">${w.likes || 0}</span>
                                </button>
                                <div class="wish-time">${formatDate(w.time)}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 處理按讚/取消讚
        window.toggleLike = async function(id) {
            const wish = allWishes.find(w => w.id == id);
            if (!wish) return;
            
            const currentlyLiked = !!userLikes[id];
            const action = currentlyLiked ? 'unlike' : 'like';
            
            try {
                // 發送請求到後端
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'like',
                        wishId: id,
                        action: action
                    })
                });
                const result = await response.json();
                if (result.success) {
                    if (currentlyLiked) {
                        delete userLikes[id];
                        wish.likes = Math.max((wish.likes || 0) - 1, 0);
                    } else {
                        userLikes[id] = true;
                        wish.likes = (wish.likes || 0) + 1;
                    }
                    localStorage.setItem('wishLikes', JSON.stringify(userLikes));
                    render();
                } else {
                    alert('無法更新收藏，請稍後再試');
                }
            } catch (err) {
                console.error('按讚失敗:', err);
                alert('連線異常，請檢查網路');
            }
        };

        // 載入所有願望
        async function loadWishes() {
            showLoading();
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data.success && Array.isArray(data.wishes)) {
                    allWishes = data.wishes;
                    render();
                } else {
                    allWishes = [];
                    render();
                }
            } catch (err) {
                console.error('載入失敗:', err);
                document.getElementById('wishesList').innerHTML = '<div class="empty-state">⚠️ 許願池暫時連結不穩，稍後再試 ⚠️</div>';
            }
        }

        // 新增願望
        async function addWish(name, wishText) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'wish',
                        name: name || '匿名',
                        wish: wishText
                    })
                });
                const result = await response.json();
                return result.success === true;
            } catch (err) {
                console.error('送出失敗:', err);
                return false;
            }
        }

        // 輔助函式
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '近日';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return '近日';
                return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
            } catch(e) {
                return '近日';
            }
        }

        // 監聽提交按鈕
        document.getElementById('submitBtn').addEventListener('click', async () => {
            const nameInput = document.getElementById('nameInput');
            const wishInput = document.getElementById('wishInput');
            const name = nameInput.value.trim();
            const wishText = wishInput.value.trim();
            
            if (!wishText) {
                alert('請寫下你的願望或靈感～');
                return;
            }
            if (wishText.length > 500) {
                alert('願望內容請在 500 字以內 ✨');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = '✦ 投擲中 ... ✦';
            submitBtn.disabled = true;
            
            const success = await addWish(name, wishText);
            if (success) {
                nameInput.value = '';
                wishInput.value = '';
                await loadWishes();  // 重新載入最新願望
                alert('✨ 願望已投入池中，靈感閃爍 ✨');
            } else {
                alert('❄️ 許願池暫時無法承接，請稍後再試');
            }
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
        });

        // 排序切換
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                render();
            });
        });

        // 載入導航列 & 初始資料
        fetch('nav.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('nav-placeholder').innerHTML = html;
                // 重新執行導航高亮腳本（若有需要）
                const scripts = document.querySelectorAll('#nav-placeholder script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));
        
        // 初始化載入願望
        loadWishes();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>許願池 · 靈感閣 WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf8f5;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif;
            color: #2c2b28;
            padding-bottom: 70px;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 48px;
            background: rgba(253, 252, 251, 0.96);
            backdrop-filter: blur(15px);
            z-index: 9999;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-logo-group {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .nav-logo-main {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            color: #1a1a1a;
        }

        .nav-logo-sub {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.45rem;
            letter-spacing: 0.35em;
            color: #a68b5b;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav-links a.active {
            color: #a68b5b !important;
            font-weight: 500;
        }

        .container {
            max-width: 800px;
            margin: 130px auto 60px;
            padding: 0 28px;
        }

        .pool-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .pool-header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.4rem;
            font-weight: 500;
            color: #3c352c;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }

        .pool-header p {
            font-size: 0.85rem;
            color: #9b8e7c;
            border-top: 1px solid #e2d9cf;
            display: inline-block;
            padding-top: 14px;
        }

        .form-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 38px;
            box-shadow: 0 18px 32px -12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(166, 139, 91, 0.2);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #a68b5b;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.95rem;
            background: #fefcf9;
            border: 1px solid #e4dbcf;
            border-radius: 48px;
            font-family: inherit;
            outline: none;
            color: #2c2b28;
        }

        .form-group textarea {
            border-radius: 32px;
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c2a277;
            box-shadow: 0 0 0 3px rgba(166, 139, 91, 0.12);
        }

        .submit-btn {
            background: #a68b5b;
            border: none;
            padding: 12px 34px;
            border-radius: 50px;
            color: white;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .submit-btn:hover {
            background: #8e734a;
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background: #cbbca8;
            cursor: not-allowed;
            transform: none;
        }

        .toast-msg {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2b28e6;
            backdrop-filter: blur(12px);
            color: #f0ebe2;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 0.75rem;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            nav { padding: 18px 24px; }
            .nav-links { gap: 20px; }
            .container { margin-top: 110px; padding: 0 20px; }
            .form-card { padding: 24px; }
            .pool-header h1 { font-size: 2rem; }
            .toast-msg { white-space: normal; text-align: center; max-width: 85vw; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo-group">
        <span class="nav-logo-main">靈感閣</span>
        <span class="nav-logo-sub">WunderKammer</span>
    </a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="note_1.html">Notes</a>
        <a href="wish.html" class="active">Wish</a>
    </div>
</nav>

<div class="container">
    <div class="pool-header">
        <h1>許願池</h1>
        <p>許下你的奇思妙想，為靈感閣開啟新的一嶼。</p>
    </div>

    <div class="form-card">
        <div class="form-group">
            <label>🌿 暱稱</label>
            <input type="text" id="nickname" placeholder="如：深海旅人 / 靈感學徒" maxlength="30">
        </div>
        <div class="form-group">
            <label>📖 你的願望・想學的內容・任何想對我說的話</label>
            <textarea id="message" rows="4" placeholder="寫下你心中的許願⋯⋯"></textarea>
        </div>
        <button class="submit-btn" id="submitBtn">
            <i class="fas fa-feather-alt"></i> 貼上許願牆
        </button>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    // ========== 请确认这里的网址与您部署的完全一致 ==========
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw3HXJ9cP7I9ucQ82MITZhmQ4jy1gGiosvuTT5FRqZaeAAqkBnXv4aq0oiCfgpFAxJr/exec';
    // =====================================================

    const submitBtn = document.getElementById('submitBtn');
    const nicknameInput = document.getElementById('nickname');
    const messageInput = document.getElementById('message');

    function showToast(msg, isSuccess = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = (isSuccess ? '✓ ' : '') + msg;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2500);
    }

    async function submitWish() {
        const nickname = nicknameInput.value.trim();
        const message = messageInput.value.trim();

        if (!message) {
            showToast('✨ 願望不能留空，請寫下靈感 ✨');
            return;
        }

        const finalNickname = nickname || '匿名旅人';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 送出中...';

        try {
            // 使用 POST 方法发送数据
            const response = await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',  // 避开 CORS 限制
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    nickname: finalNickname,
                    message: message
                })
            });

            showToast('🌟 願望已送入許願池！感謝你 🌟', true);
            
            // 清空表单
            nicknameInput.value = '';
            messageInput.value = '';
            
        } catch (error) {
            console.error('送出失败:', error);
            showToast('❌ 連線異常，請稍後再試');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-feather-alt"></i> 貼上許願牆';
        }
    }

    submitBtn.addEventListener('click', submitWish);

    // Ctrl + Enter 快捷送出
    messageInput.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            submitWish();
        }
    });
</script>

</body>
</html>

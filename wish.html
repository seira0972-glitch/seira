<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許願池｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background: #ffffff; 
            color: #2c2c2c; 
            line-height: 1.6; 
            overflow-x: hidden;
        }
        #nav-placeholder { min-height: 70px; }

        .container { max-width: 720px; margin: 0 auto; padding: 60px 24px 100px; position: relative; z-index: 5; background: #ffffff; }

        .hero { text-align: center; margin-bottom: 48px; }
        .hero-en { font-family: 'Bodoni Moda', serif; font-size: 0.7rem; font-style: italic; color: #b59d6e; letter-spacing: 0.5em; text-transform: uppercase; margin-bottom: 12px; }
        .hero-zh { font-family: 'Noto Serif TC', serif; font-size: 2rem; font-weight: 400; letter-spacing: 0.2em; color: #2c2c2c; margin-bottom: 12px; }
        .hero p { font-size: 0.85rem; color: #888; letter-spacing: 0.08em; }

        .wish-form { background: #fefaf5; padding: 28px 32px; margin: 32px 0 40px; border: 1px solid #ece5e0; border-radius: 4px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.75rem; letter-spacing: 0.12em; color: #b59d6e; margin-bottom: 6px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #ece5e0; font-family: inherit; font-size: 0.9rem; background: white; outline: none; transition: all 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color: #b59d6e; box-shadow: 0 0 0 2px rgba(181,157,110,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .submit-btn { background: #b59d6e; color: white; border: none; padding: 10px 28px; font-family: inherit; font-size: 0.85rem; letter-spacing: 0.15em; cursor: pointer; transition: all 0.2s; width: auto; min-width: 140px; }
        .submit-btn:hover { background: #9b7e54; transform: translateY(-1px); }

        .wishes-wall { border-top: 1px solid #ece5e0; padding-top: 40px; margin-top: 8px; }
        .wishes-wall h3 { font-family: 'Noto Serif TC', serif; font-size: 1.1rem; font-weight: 400; letter-spacing: 0.2em; color: #b59d6e; text-align: center; margin-bottom: 32px; }
        .wishes-list { display: flex; flex-direction: column; gap: 20px; }
        
        /* 留言卡片 */
        .wish-item { 
            background: #ffffff; 
            padding: 18px 24px; 
            border-left: 3px solid #b59d6e; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); 
            transition: all 0.2s; 
            animation: ripple 0.5s ease-out;
        }
        .wish-item:hover { border-left-color: #c9aa7b; background: #fefcf9; }
        @keyframes ripple { 0% { opacity: 0; transform: translateX(-6px); } 100% { opacity: 1; transform: translateX(0); } }
        
        .wish-name { font-family: 'Noto Serif TC', serif; font-weight: 500; color: #b59d6e; font-size: 0.85rem; margin-bottom: 6px; letter-spacing: 0.05em; }
        .wish-text { font-size: 0.9rem; color: #3a3a3a; line-height: 1.6; margin-bottom: 8px; padding-left: 4px; }
        .wish-time { font-size: 0.65rem; color: #bbb; text-align: right; margin-top: 6px; font-family: monospace; }
        
        /* 回覆區塊 */
        .reply-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #ece5e0;
        }
        .reply-text {
            font-size: 0.85rem;
            color: #b59d6e;
            background: #fefaf5;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .reply-input-area {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .reply-input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ece5e0;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: inherit;
            outline: none;
        }
        .reply-input:focus {
            border-color: #b59d6e;
        }
        .reply-btn {
            background: #b59d6e;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .reply-btn:hover {
            opacity: 0.8;
        }
        .reply-time {
            font-size: 0.6rem;
            color: #ccc;
            margin-top: 4px;
            text-align: right;
        }
        .owner-badge {
            display: inline-block;
            background: #b59d6e20;
            color: #b59d6e;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 12px;
            margin-left: 8px;
        }

        .loading { text-align: center; color: #aaa; padding: 40px 20px; font-size: 0.85rem; }

        footer { text-align: center; padding: 40px 24px 32px; border-top: 1px solid #f0ede8; font-family: 'Bodoni Moda', serif; font-size: 0.55rem; letter-spacing: 0.4em; color: #ccc; text-transform: uppercase; margin-top: 20px; }

        /* 煙花動畫 */
        .spark-rocket {
            position: fixed;
            bottom: -30px;
            width: 4px;
            height: 35px;
            background: linear-gradient(180deg, #f9d976, #f0b27a);
            border-radius: 2px;
            pointer-events: none;
            z-index: 10000;
            animation: shootUpSpark 0.65s cubic-bezier(0.2, 0.9, 0.4, 1.2) forwards;
        }
        @keyframes shootUpSpark {
            0% { bottom: -30px; opacity: 1; height: 35px; }
            100% { bottom: 38%; opacity: 0.8; height: 85px; }
        }
        .gold-spark {
            position: fixed;
            width: 5px;
            height: 5px;
            background: radial-gradient(circle, #f9e0a0, #e6b422);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
            animation: sparkFloat 0.9s ease-out forwards;
        }
        @keyframes sparkFloat {
            0% { opacity: 1; transform: scale(0.8) translateY(0); }
            100% { opacity: 0; transform: scale(0.3) translateY(-40px); }
        }
        .success-message {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Noto Serif TC', serif;
            font-size: 1.3rem;
            letter-spacing: 0.2em;
            color: #b59d6e;
            background: rgba(255,255,240,0.95);
            padding: 12px 28px;
            border-radius: 60px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 10010;
            animation: fadeOutUp 1.5s ease-out forwards;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        @keyframes fadeOutUp {
            0% { opacity: 0; transform: translate(-50%, 30px); }
            20% { opacity: 1; transform: translate(-50%, -50%); }
            70% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -100px); }
        }

        @media (max-width: 768px) {
            .container { padding: 40px 20px 60px; }
            .hero-zh { font-size: 1.6rem; }
            .wish-form { padding: 20px 20px; margin: 24px 0 32px; }
            .success-message { font-size: 1rem; padding: 8px 20px; white-space: nowrap; }
            .reply-input-area { flex-direction: column; }
            .reply-btn { align-self: flex-end; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <div class="container">
        <div class="hero">
            <div class="hero-en">WunderKammer</div>
            <h1 class="hero-zh">許願池</h1>
            <p>留下你的願望、想學的內容、或任何想對我說的話</p>
        </div>

        <div class="wish-form">
            <div class="form-group">
                <label>暱稱</label>
                <input type="text" id="nameInput" placeholder="怎麼稱呼你？" maxlength="30">
            </div>
            <div class="form-group">
                <label>你的願望 / 想學的內容 / 任何想對我說的話</label>
                <textarea id="wishInput" placeholder="許個願吧..."></textarea>
            </div>
            <div style="text-align: center;">
                <button class="submit-btn" id="submitBtn">💫 許願</button>
            </div>
        </div>

        <div class="wishes-wall">
            <h3>✨ 池中願望 ✨</h3>
            <div id="wishesList" class="wishes-list"><div class="loading">載入中...</div></div>
        </div>
    </div>
    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzKUkgjIG4wjE2WGJk76y4xVI3eo9mi6KSCNUnBwMhBFlTwxBOSPrllUqtvR4GpSGp9/exec';
        
        // 儲存回覆的資料（存在 localStorage）
        let replies = {};

        function loadReplies() {
            const saved = localStorage.getItem('wishReplies');
            if (saved) {
                replies = JSON.parse(saved);
            }
        }

        function saveReplies() {
            localStorage.setItem('wishReplies', JSON.stringify(replies));
        }

        function addReply(wishIndex, replyText) {
            if (!replies[wishIndex]) {
                replies[wishIndex] = [];
            }
            replies[wishIndex].push({
                text: replyText,
                time: new Date().toISOString()
            });
            saveReplies();
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                const year = date.getFullYear();
                const month = (date.getMonth() + 1).toString().padStart(2, '0');
                const day = date.getDate().toString().padStart(2, '0');
                const hours = date.getHours().toString().padStart(2, '0');
                const minutes = date.getMinutes().toString().padStart(2, '0');
                return `${year}/${month}/${day} ${hours}:${minutes}`;
            } catch(e) {
                return '';
            }
        }

        function formatReplyTime(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
            } catch(e) {
                return '';
            }
        }

        function renderWishes(wishes) {
            const container = document.getElementById('wishesList');
            if (!wishes || wishes.length === 0) {
                container.innerHTML = '<div class="loading">還沒有許願，來當第一個吧 ✨</div>';
                return;
            }
            
            container.innerHTML = wishes.map((wish, idx) => {
                let name = wish.name;
                let wishText = wish.wish;
                if (name === undefined || name === null) name = '';
                if (wishText === undefined || wishText === null) wishText = '';
                
                const replyList = replies[idx] || [];
                const replyHtml = replyList.map(r => `
                    <div class="reply-text">
                        💬 ${escapeHtml(r.text)}
                        <div class="reply-time">${formatReplyTime(r.time)}</div>
                    </div>
                `).join('');
                
                return `
                    <div class="wish-item" data-idx="${idx}">
                        <div class="wish-name">✨ ${escapeHtml(String(name)) || '一位訪客'}</div>
                        <div class="wish-text">「${escapeHtml(String(wishText))}」</div>
                        <div class="wish-time">${formatDateTime(wish.time)}</div>
                        <div class="reply-section">
                            <div class="replies-container">${replyHtml}</div>
                            <div class="reply-input-area">
                                <input type="text" class="reply-input" placeholder="回覆此願望..." maxlength="200">
                                <button class="reply-btn" onclick="handleReply(${idx}, this)">回覆</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.handleReply = function(wishIdx, btn) {
            const input = btn.parentElement.querySelector('.reply-input');
            const replyText = input.value.trim();
            if (!replyText) {
                alert('請輸入回覆內容');
                return;
            }
            
            addReply(wishIdx, replyText);
            input.value = '';
            
            // 重新載入留言
            loadWishes();
        };

        async function loadWishes() {
            const c = document.getElementById('wishesList');
            c.innerHTML = '<div class="loading">載入中...</div>';
            try {
                const r = await fetch(API_URL);
                const d = await r.json();
                if (d.success && d.wishes && d.wishes.length) {
                    renderWishes(d.wishes);
                } else {
                    c.innerHTML = '<div class="loading">還沒有許願，來當第一個吧 ✨</div>';
                }
            } catch(e) {
                console.error(e);
                c.innerHTML = '<div class="loading">載入失敗，請稍後再試</div>';
            }
        }

        async function addWish(n,w) { 
            try { 
                await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,wish:w})}); 
                return true; 
            } catch(e) { 
                return false; 
            } 
        }
        
        function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g,m=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]||m)); }

        // 煙花動畫
        function launchSparkFirework(x, y) {
            const rocket = document.createElement('div');
            rocket.className = 'spark-rocket';
            const startX = x + (Math.random() - 0.5) * 70;
            rocket.style.left = startX + 'px';
            document.body.appendChild(rocket);
            
            setTimeout(() => {
                rocket.remove();
                burstSparks(x, y);
            }, 620);
        }

        function burstSparks(x, y) {
            const sparkCount = 45;
            for (let i = 0; i < sparkCount; i++) {
                setTimeout(() => {
                    const spark = document.createElement('div');
                    spark.className = 'gold-spark';
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 70;
                    const dx = Math.cos(angle) * distance;
                    const dy = Math.sin(angle) * distance;
                    spark.style.left = (x + dx) + 'px';
                    spark.style.top = (y + dy) + 'px';
                    document.body.appendChild(spark);
                    setTimeout(() => spark.remove(), 900);
                }, i * 10);
            }
        }

        function showSuccess() {
            const msg = document.createElement('div');
            msg.className = 'success-message';
            msg.textContent = '✨ 許願成功 ✨';
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 1500);
        }

        function celebrate() {
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight * 0.38;
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const offsetX = (Math.random() - 0.5) * 160;
                    launchSparkFirework(centerX + offsetX, centerY);
                }, i * 380);
            }
            setTimeout(() => showSuccess(), 1000);
        }

        // 導航欄載入
        fetch('nav.html').then(res => res.text()).then(data => {
            document.getElementById('nav-placeholder').innerHTML = data;
            document.querySelectorAll('#nav-placeholder script').forEach(s => { const ns = document.createElement('script'); ns.textContent = s.textContent; s.parentNode.replaceChild(ns, s); });
        }).catch(e => console.log('導航載入失敗:', e));

        // 初始化
        loadReplies();
        loadWishes();

        // 許願按鈕
        document.getElementById('submitBtn').onclick = async () => {
            const n = document.getElementById('nameInput').value.trim();
            const w = document.getElementById('wishInput').value.trim();
            if(!w) return alert('請寫下你的願望～');
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = '許願中...';
            
            if(await addWish(n||'匿名', w)) {
                document.getElementById('nameInput').value = '';
                document.getElementById('wishInput').value = '';
                celebrate();
                setTimeout(() => loadWishes(), 1500);
            } else {
                alert('送出失敗，請稍後再試');
            }
            btn.disabled = false; btn.textContent = '💫 許願';
        };
    </script>
</body>
</html>

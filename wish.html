<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許願池｜WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #2c2c2c;
            line-height: 1.7;
        }

        #nav-placeholder {
            min-height: 70px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 80px 24px 120px;
        }

        .hero {
            text-align: center;
            margin-bottom: 60px;
        }
        .hero-en {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.75rem;
            font-style: italic;
            color: #b59d6e;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .hero-zh {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.4rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            color: #2c2c2c;
            margin-bottom: 20px;
        }
        .hero p {
            font-size: 0.9rem;
            color: #888;
            letter-spacing: 0.08em;
        }

        .wish-form {
            background: #fefaf5;
            padding: 32px;
            margin-bottom: 48px;
            border: 1px solid #ece5e0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            color: #b59d6e;
            margin-bottom: 8px;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ece5e0;
            font-family: inherit;
            font-size: 0.9rem;
            background: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #b59d6e;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .submit-btn {
            background: #b59d6e;
            color: white;
            border: none;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .submit-btn:hover {
            opacity: 0.85;
        }

        .wishes-wall {
            border-top: 1px solid #ece5e0;
            padding-top: 40px;
        }
        .wishes-wall h3 {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #b59d6e;
            text-align: center;
            margin-bottom: 32px;
        }
        .wishes-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .wish-item {
            background: #ffffff;
            padding: 20px 24px;
            border-left: 2px solid #b59d6e;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            animation: ripple 0.6s ease-out;
        }
        @keyframes ripple {
            0% {
                opacity: 0;
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(181, 157, 110, 0.3);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.01);
                box-shadow: 0 0 0 8px rgba(181, 157, 110, 0.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(181, 157, 110, 0);
            }
        }
        .wish-name {
            font-family: 'Noto Serif TC', serif;
            font-weight: 500;
            color: #b59d6e;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .wish-text {
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .wish-time {
            font-size: 0.7rem;
            color: #aaa;
            text-align: right;
        }
        .loading {
            text-align: center;
            color: #aaa;
            padding: 40px;
        }

        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid #f0ede8;
            font-family: 'Bodoni Moda', serif;
            font-size: 0.6rem;
            letter-spacing: 0.4em;
            color: #ccc;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .container { padding: 60px 20px 80px; }
            .hero-zh { font-size: 1.8rem; }
            .wish-form { padding: 24px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="container">
        <div class="hero">
            <div class="hero-en">WunderKammer</div>
            <h1 class="hero-zh">許願池</h1>
            <p>留下你的願望、想學的內容、或任何想對我說的話</p>
        </div>

        <div class="wish-form">
            <div class="form-group">
                <label>暱稱</label>
                <input type="text" id="nameInput" placeholder="怎麼稱呼你？" maxlength="30">
            </div>
            <div class="form-group">
                <label>你的願望 / 想學的內容</label>
                <textarea id="wishInput" placeholder="許個願吧..."></textarea>
            </div>
            <button class="submit-btn" id="submitBtn">💫 許願</button>
        </div>

        <div class="wishes-wall">
            <h3>✨ 大家的許願 ✨</h3>
            <div id="wishesList" class="wishes-list">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>

    <footer>WUNDERKAMMER · 靈感閣</footer>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzKUkgjIG4wjE2WGJk76y4xVI3eo9mi6KSCNUnBwMhBFlTwxBOSPrllUqtvR4GpSGp9/exec';

        // 載入導航欄
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                const scripts = document.querySelectorAll('#nav-placeholder script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    newScript.textContent = oldScript.textContent;
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => console.log('導航載入失敗:', err));

        // 載入所有留言
        async function loadWishes() {
            const container = document.getElementById('wishesList');
            container.innerHTML = '<div class="loading">載入中...</div>';
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                if (data.success && data.wishes && data.wishes.length > 0) {
                    container.innerHTML = data.wishes.map(wish => {
                        let name = wish.name;
                        let wishText = wish.wish;
                        if (name === undefined || name === null) name = '';
                        if (wishText === undefined || wishText === null) wishText = '';
                        return `
                            <div class="wish-item">
                                <div class="wish-name">${escapeHtml(String(name)) || '匿名'}</div>
                                <div class="wish-text">${escapeHtml(String(wishText))}</div>
                                <div class="wish-time">${formatDate(wish.time)}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    container.innerHTML = '<div class="loading">還沒有許願，來當第一個吧 ✨</div>';
                }
            } catch (err) {
                console.error('載入失敗:', err);
                container.innerHTML = '<div class="loading">載入失敗，請稍後再試</div>';
            }
        }

        // 新增留言
        async function addWish(name, wish) {
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, wish: wish })
                });
                return true;
            } catch (err) {
                console.error('送出失敗:', err);
                return false;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
            } catch(e) {
                return '';
            }
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const name = document.getElementById('nameInput').value.trim();
            const wish = document.getElementById('wishInput').value.trim();
            if (!wish) {
                alert('請寫下你的願望～');
                return;
            }
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '許願中...';
            
            const success = await addWish(name || '匿名', wish);
            if (success) {
                document.getElementById('nameInput').value = '';
                document.getElementById('wishInput').value = '';
                await loadWishes();
            } else {
                alert('送出失敗，請稍後再試');
            }
            submitBtn.disabled = false;
            submitBtn.textContent = '💫 許願';
        });

        loadWishes();
    </script>
</body>
</html>

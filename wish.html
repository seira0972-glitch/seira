<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>許願池 · 靈感閣 WunderKammer</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #faf8f5;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans', sans-serif;
            color: #2c2b28;
            padding-bottom: 70px;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 48px;
            background: rgba(253, 252, 251, 0.96);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        .nav-logo-group {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.2;
        }

        .nav-logo-main {
            font-family: 'Noto Serif TC', serif;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            color: #1a1a1a;
            text-indent: 0.25em;
        }

        .nav-logo-sub {
            font-family: 'Bodoni Moda', serif;
            font-size: 0.45rem;
            letter-spacing: 0.35em;
            color: #a68b5b;
            text-transform: uppercase;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            text-decoration: none;
            color: #999;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .nav-links a.active {
            color: #a68b5b !important;
            font-weight: 500;
        }

        .wish-container {
            max-width: 1200px;
            margin: 130px auto 40px;
            padding: 0 28px;
        }

        .pool-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .pool-header h1 {
            font-family: 'Noto Serif TC', serif;
            font-size: 2.4rem;
            font-weight: 500;
            color: #3c352c;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
        }

        .pool-header p {
            font-size: 0.85rem;
            color: #9b8e7c;
            letter-spacing: 0.5px;
            border-top: 1px solid #e2d9cf;
            display: inline-block;
            padding-top: 14px;
        }

        .form-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 38px;
            margin-bottom: 58px;
            box-shadow: 0 18px 32px -12px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(166, 139, 91, 0.2);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #a68b5b;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 20px;
            font-size: 0.95rem;
            background: #fefcf9;
            border: 1px solid #e4dbcf;
            border-radius: 48px;
            font-family: inherit;
            transition: 0.2s;
            outline: none;
            color: #2c2b28;
        }

        .form-group textarea {
            border-radius: 32px;
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c2a277;
            box-shadow: 0 0 0 3px rgba(166, 139, 91, 0.12);
        }

        .submit-btn {
            background: #a68b5b;
            border: none;
            padding: 12px 34px;
            border-radius: 50px;
            color: white;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .submit-btn:hover {
            background: #8e734a;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(142, 115, 74, 0.2);
        }

        .filter-bar {
            display: flex;
            justify-content: flex-end;
            gap: 28px;
            margin-bottom: 32px;
            border-bottom: 1px solid #eee5db;
            padding-bottom: 12px;
        }

        .filter-btn {
            background: none;
            border: none;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #b7aa99;
            cursor: pointer;
            padding: 6px 2px;
            transition: 0.2s;
            font-weight: 500;
        }

        .filter-btn.active {
            color: #a68b5b;
            border-bottom: 2px solid #a68b5b;
        }

        .wish-wall {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 30px;
            margin-top: 8px;
        }

        .wish-card {
            background: #ffffffdb;
            backdrop-filter: blur(2px);
            border-radius: 32px;
            padding: 26px;
            transition: all 0.25s ease;
            border: 1px solid #efe5db;
            box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .wish-card:hover {
            transform: translateY(-4px);
            border-color: #d6c7b7;
            background: white;
            box-shadow: 0 18px 28px -12px rgba(0, 0, 0, 0.08);
        }

        .wish-nickname {
            font-family: 'Noto Serif TC', serif;
            font-weight: 600;
            font-size: 1.05rem;
            color: #4f463b;
            display: inline-block;
            border-left: 3px solid #dbbc97;
            padding-left: 12px;
            margin-bottom: 16px;
        }

        .wish-message {
            font-size: 0.9rem;
            line-height: 1.55;
            color: #3a352e;
            margin: 16px 0 20px 0;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .wish-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #b2a48f;
            border-top: 1px solid #f0e8df;
            padding-top: 16px;
        }

        .like-btn {
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            color: #bfae98;
            font-size: 0.75rem;
            transition: 0.2s;
            padding: 4px 8px;
            border-radius: 40px;
        }

        .like-btn i {
            font-size: 0.85rem;
        }

        .like-btn:hover {
            color: #c97e4a;
            background: #faf3ea;
        }

        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #d4c5b5;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #c97e4a;
            background: #faf3ea;
        }

        .date-badge {
            letter-spacing: 0.4px;
            font-size: 0.7rem;
        }

        .empty-message {
            text-align: center;
            padding: 70px 24px;
            background: #fefaf5;
            border-radius: 56px;
            color: #c0ae98;
            font-size: 0.85rem;
            grid-column: 1 / -1;
        }

        .toast-msg {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c2b28e6;
            backdrop-filter: blur(12px);
            color: #f0ebe2;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 0.75rem;
            letter-spacing: 1px;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        @media (max-width: 720px) {
            nav {
                padding: 18px 24px;
            }
            .nav-links {
                gap: 20px;
            }
            .wish-container {
                margin-top: 110px;
                padding: 0 20px;
            }
            .form-card {
                padding: 26px;
            }
            .pool-header h1 {
                font-size: 2rem;
            }
            .toast-msg {
                white-space: normal;
                text-align: center;
                max-width: 85vw;
            }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="nav-logo-group">
        <span class="nav-logo-main">靈感閣</span>
        <span class="nav-logo-sub">WunderKammer</span>
    </a>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="note_1.html">Notes</a>
        <a href="wish.html" class="active">Wish</a>
    </div>
</nav>

<div class="wish-container">
    <div class="pool-header">
        <h1>許願池</h1>
        <p>許下你的奇思妙想，為靈感閣開啟新的一嶼。</p>
    </div>

    <div class="form-card">
        <div class="form-group">
            <label>🌿 暱稱</label>
            <input type="text" id="nicknameInput" placeholder="如：深海旅人 / 靈感學徒" maxlength="28">
        </div>
        <div class="form-group">
            <label>📖 你的願望・想學的內容・任何想對我說的話</label>
            <textarea id="wishMessageInput" rows="3" placeholder="寫下你心中的許願⋯⋯"></textarea>
        </div>
        <button class="submit-btn" id="submitWishBtn"><i class="fas fa-feather-alt"></i> 貼上許願牆</button>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" data-sort="latest">最新留言</button>
        <button class="filter-btn" data-sort="likes">最多讚</button>
    </div>

    <div id="wishWall" class="wish-wall"></div>
</div>

<div id="toastMsg" class="toast-msg"></div>

<script>
    // ---------- 许愿墙核心（完全空白的初始状态）----------
    const STORAGE_KEY = 'wunderkammer_wishes_clean';
    
    // 重要：DEFAULT_WISHES 设为空数组！一开始完全没有预设愿望
    const DEFAULT_WISHES = [];

    let currentSort = 'latest';

    function formatDate(timestamp) {
        const date = new Date(timestamp);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    function loadWishes() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (Array.isArray(parsed)) {
                    return parsed;
                } else {
                    saveWishes(DEFAULT_WISHES);
                    return [...DEFAULT_WISHES];
                }
            } catch(e) {
                saveWishes(DEFAULT_WISHES);
                return [...DEFAULT_WISHES];
            }
        } else {
            // 第一次使用：保存空数组，没有任何预设愿望
            saveWishes(DEFAULT_WISHES);
            return [...DEFAULT_WISHES];
        }
    }

    function saveWishes(wishes) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(wishes));
    }

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.opacity = '1';
        setTimeout(() => {
            toast.style.opacity = '0';
        }, 2200);
    }

    function addWish(nickname, message) {
        const cleanMsg = message?.trim();
        if (!cleanMsg) {
            showToast('✨ 願望不能留空，請寫下靈感 ✨');
            return false;
        }
        let cleanNick = nickname?.trim();
        if (!cleanNick) cleanNick = '匿名旅人';
        if (cleanNick.length > 28) cleanNick = cleanNick.slice(0, 28);
        
        const newWish = {
            id: Date.now() + '-' + Math.random().toString(36).substring(2, 8),
            nickname: cleanNick,
            message: cleanMsg,
            likes: 0,
            createdAt: Date.now()
        };
        const wishes = loadWishes();
        wishes.unshift(newWish);
        saveWishes(wishes);
        renderWishWall(currentSort);
        showToast('🌟 願望已投入池中，靈力匯聚 🌟');
        return true;
    }

    function deleteWish(wishId) {
        let wishes = loadWishes();
        const newWishes = wishes.filter(w => w.id !== wishId);
        if (newWishes.length === wishes.length) {
            showToast('❓ 願望不存在');
            return;
        }
        saveWishes(newWishes);
        renderWishWall(currentSort);
        showToast('🗑️ 願望已從池中消失');
    }

    function likeWish(wishId) {
        let wishes = loadWishes();
        const target = wishes.find(w => w.id === wishId);
        if (target) {
            target.likes = (target.likes || 0) + 1;
            saveWishes(wishes);
            renderWishWall(currentSort);
            showToast('💛 感謝點讚，願力共鳴');
        }
    }

    function renderWishWall(sortType) {
        let wishes = loadWishes();
        const wallContainer = document.getElementById('wishWall');
        if (!wishes.length) {
            wallContainer.innerHTML = '<div class="empty-message">🎐 許願牆空靈如鏡，等你書寫第一道願望 🎐</div>';
            return;
        }
        
        let sorted = [...wishes];
        if (sortType === 'latest') {
            sorted.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        } else if (sortType === 'likes') {
            sorted.sort((a, b) => (b.likes || 0) - (a.likes || 0));
        }
        
        wallContainer.innerHTML = '';
        for (let wish of sorted) {
            const card = document.createElement('div');
            card.className = 'wish-card';
            const dateStr = formatDate(wish.createdAt || Date.now());
            const safeNick = escapeHtml(wish.nickname);
            const safeMsg = escapeHtml(wish.message);
            card.innerHTML = `
                <div class="wish-nickname">${safeNick}</div>
                <div class="wish-message">${safeMsg}</div>
                <div class="wish-footer">
                    <div style="display: flex; gap: 8px;">
                        <button class="like-btn" data-id="${wish.id}">
                            <i class="far fa-heart"></i> <span class="like-count">${wish.likes || 0}</span>
                        </button>
                        <button class="delete-btn" data-id="${wish.id}" title="刪除願望">
                            <i class="far fa-trash-alt"></i>
                        </button>
                    </div>
                    <span class="date-badge"><i class="far fa-calendar-alt"></i> ${dateStr}</span>
                </div>
            `;
            wallContainer.appendChild(card);
        }
        
        // 绑定点赞事件
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const wid = btn.getAttribute('data-id');
                if (wid) likeWish(wid);
            });
        });
        
        // 绑定删除事件
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const wid = btn.getAttribute('data-id');
                if (wid && confirm('確定要刪除這則許願嗎？')) {
                    deleteWish(wid);
                }
            });
        });
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function setSort(type) {
        currentSort = type;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            if (btn.getAttribute('data-sort') === type) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderWishWall(currentSort);
    }
    
    function init() {
        // 确保存储是空数组，没有任何预设愿望
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
            saveWishes([]);  // 明确保存空数组
        } else {
            try {
                const existing = JSON.parse(raw);
                if (!Array.isArray(existing)) {
                    saveWishes([]);
                }
                // 如果已经有数据，保留用户自己的数据，不添加任何预设
            } catch(e) {
                saveWishes([]);
            }
        }
        
        renderWishWall('latest');
        
        const latestBtn = document.querySelector('[data-sort="latest"]');
        const likesBtn = document.querySelector('[data-sort="likes"]');
        if (latestBtn) latestBtn.addEventListener('click', () => setSort('latest'));
        if (likesBtn) likesBtn.addEventListener('click', () => setSort('likes'));
        
        const submitBtn = document.getElementById('submitWishBtn');
        submitBtn.addEventListener('click', () => {
            const nickname = document.getElementById('nicknameInput').value;
            const message = document.getElementById('wishMessageInput').value;
            const success = addWish(nickname, message);
            if (success) {
                document.getElementById('nicknameInput').value = '';
                document.getElementById('wishMessageInput').value = '';
            }
        });
        
        const textarea = document.getElementById('wishMessageInput');
        textarea.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                submitBtn.click();
            }
        });
    }
    
    init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服務項目 | 我的品牌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 70px 20px;
        }
        h1 {
            text-align: center;
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 50px;
            font-size: 1.1rem;
        }
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 35px;
        }
        .service-card {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            border-left: 6px solid #667eea;
            transition: all 0.3s;
        }
        .service-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(102,126,234,0.12);
        }
        .service-card h3 {
            color: #667eea;
            font-size: 1.7rem;
            margin-bottom: 20px;
        }
        .service-card p {
            color: #555;
            margin: 15px 0;
            line-height: 1.6;
        }
        .service-card ul {
            margin-left: 20px;
            color: #666;
        }
        .service-card li {
            margin: 8px 0;
        }
        footer {
            background: #1e293b;
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            margin-top: 40px;
        }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .service-card { padding: 25px; }
        }
    </style>
</head>
<body>
    <div id="nav-placeholder"></div>
    <script>
        fetch('nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('nav-placeholder').innerHTML = data;
                setTimeout(() => {
                    const links = document.querySelectorAll('#nav-placeholder nav a');
                    links.forEach(link => {
                        if (link.getAttribute('href') === 'services.html') {
                            link.style.color = '#667eea';
                            link.style.borderBottom = '2px solid #667eea';
                        }
                    });
                }, 100);
            })
            .catch(err => console.log('導航載入失敗:', err));
    </script>

    <div class="container">
        <h1>我們的服務</h1>
        <p class="subtitle">專業、快速、免後端 — 為你量身打造的數位解決方案</p>
        <div class="service-grid">
            <div class="service-card">
                <h3>🚀 網站開發</h3>
                <p>快速建置專業品牌官網，響應式設計，手機電腦都完美顯示。</p>
                <ul>
                    <li>✔ 一鍵部署</li>
                    <li>✔ 永久免費託管</li>
                    <li>✔ 自訂網域</li>
                </ul>
            </div>
            <div class="service-card">
                <h3>🎨 品牌設計</h3>
                <p>打造獨特的視覺識別系統，讓你的品牌與眾不同。</p>
                <ul>
                    <li>✔ Logo 設計</li>
                    <li>✔ 配色方案</li>
                    <li>✔ 品牌識別手冊</li>
                </ul>
            </div>
            <div class="service-card">
                <h3>🤖 AI 顧問</h3>
                <p>導入 AI 工具，提升工作效率 10 倍，降低營運成本。</p>
                <ul>
                    <li>✔ 工作流程優化</li>
                    <li>✔ AI 工具導入</li>
                    <li>✔ 客製化開發</li>
                </ul>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 我的品牌 | 用 GitHub Pages 免費架設</p>
    </footer>
</body>
</html>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    .navbar {
        background: #ffffff;
        height: 70px;
        position: fixed;
        top: 0;
        width: 100%;
        border-bottom: 1px solid #f0e6d0;
        z-index: 1000;
    }
    .nav-container {
        max-width: 1200px;
        height: 100%;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .nav-logo {
        font-size: 1.2rem;
        font-weight: 400;
        letter-spacing: 2px;
        color: #2c2c2c;
        text-decoration: none;
    }
    .nav-menu {
        display: flex;
        list-style: none;
        gap: 36px;
    }
    .nav-link {
        text-decoration: none;
        color: #6b6b6b;
        font-weight: 400;
        font-size: 0.9rem;
        letter-spacing: 1px;
        position: relative;
        padding: 4px 0;
    }
    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 1px;
        bottom: 0;
        left: 0;
        background: #c9a87b;
        transition: width 0.3s;
    }
    .nav-link:hover::after {
        width: 100%;
    }
    .nav-link:hover {
        color: #c9a87b;
    }
    .nav-toggle {
        display: none;
        flex-direction: column;
        cursor: pointer;
        background: none;
        border: none;
    }
    .bar {
        width: 24px;
        height: 1px;
        background: #6b6b6b;
        margin: 5px 0;
    }
    @media (max-width: 768px) {
        .nav-toggle {
            display: flex;
        }
        .nav-menu {
            position: fixed;
            top: 70px;
            left: -100%;
            flex-direction: column;
            background: #ffffff;
            width: 100%;
            text-align: center;
            padding: 32px 0;
            transition: 0.3s;
            gap: 24px;
            border-bottom: 1px solid #f0e6d0;
        }
        .nav-menu.active {
            left: 0;
        }
        .nav-logo {
            font-size: 1rem;
        }
    }
</style>

<script>
    const toggle = document.getElementById('nav-toggle');
    const menu = document.getElementById('nav-menu');
    if (toggle && menu) {
        toggle.addEventListener('click', () => menu.classList.toggle('active'));
        document.querySelectorAll('.nav-link').forEach(n => n.addEventListener('click', () => menu.classList.remove('active')));
    }
</script>
